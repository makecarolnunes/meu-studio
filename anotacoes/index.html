<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anotações">
  <title>Anotações · Meu Studio</title>
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="./styles/anotacoes.css">
</head>
<body>

<div id="ano-app">

<!-- ── Header (mobile only) ── -->
<div class="hdr">
  <button class="hdr-back" id="hdr-back" onclick="window.location.href='../'" aria-label="Voltar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="hdr-center">
    <h1 id="hdr-title">Anotações</h1>
  </div>
  <div class="hdr-right">
    <button class="hdr-trash" id="hdr-trash" onclick="openTrash()" aria-label="Lixeira">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
    </button>
    <span id="hdr-save-status" class="hdr-save-status" style="display:none"></span>
  </div>
</div>

<!-- ══ LAYOUT DESKTOP: 3 colunas ══ -->
<div class="ano-cols">

  <!-- ── Col 1: Cadernos ── -->
  <div id="view-cadernos" class="ano-col-cad">

    <!-- Desktop header da coluna cadernos -->
    <div class="d-cad-hdr">
      <div class="d-cad-brand">
        <div class="d-cad-brand-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <span>Anotações</span>
      </div>
      <button class="d-cad-novo-btn" onclick="openCadForm(null)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo caderno
      </button>
      <button class="d-cad-trash-btn" onclick="openTrash()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        Lixeira
      </button>
    </div>

    <!-- Tag filter (desktop) -->
    <div id="d-tag-filter-area" class="d-tag-filter-area" style="display:none"></div>

    <!-- Lista de cadernos (mobile + desktop) -->
    <div class="content" id="cadernos-list">
      <div class="loader"><div class="spinner"></div><br>Carregando...</div>
    </div>
  </div>

  <!-- ── Col 2: Notas ── -->
  <div id="view-notas" style="display:none" class="ano-col-notas">

    <!-- Desktop toolbar notas -->
    <div class="d-notas-hdr">
      <div class="d-notas-title-row">
        <span class="d-notas-title" id="d-notas-title">Notas</span>
        <span class="d-notas-cnt" id="d-notas-cnt"></span>
      </div>
      <button class="d-nova-nota-btn" onclick="openEditor(null)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova nota
      </button>
    </div>
    <div class="d-notas-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="d-nota-search" type="text" placeholder="Buscar nota..." oninput="filterNotasSearch(this.value)" autocomplete="off">
    </div>

    <!-- Lista de notas -->
    <div class="content" id="notas-list"></div>
  </div>

  <!-- ── Col 3: Editor ── -->
  <div id="view-editor" style="display:none" class="ano-col-editor">

    <!-- Desktop editor header -->
    <div class="d-editor-hdr">
      <span class="d-editor-date" id="d-editor-date"></span>
      <div class="d-editor-actions">
        <button class="d-editor-btn d-editor-del" id="d-btn-del-nota" onclick="deleteNota()" style="display:none">Excluir</button>
        <button class="d-editor-btn d-editor-save" onclick="saveNota()">Salvar</button>
      </div>
    </div>

    <!-- Empty state (desktop, quando nenhuma nota selecionada) -->
    <div class="d-editor-empty" id="d-editor-empty">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity=".3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <p>Selecione uma nota para editar<br>ou crie uma nova</p>
    </div>

    <!-- Conteúdo do editor (oculto até selecionar/criar nota) -->
    <div id="d-editor-content" style="display:none">
      <input class="editor-titulo" id="f-titulo" type="text"
             placeholder="Título da nota" autocomplete="off"
             oninput="scheduleAutoSave()">

      <div class="save-status-bar">
        <span id="save-status" class="save-status"></span>
      </div>

      <textarea class="editor-conteudo" id="f-conteudo"
                placeholder="Escreva suas anotações aqui…"
                oninput="scheduleAutoSave()"></textarea>

      <!-- Tags -->
      <div class="editor-section">
        <div class="esec-label">Tags</div>
        <div id="edit-tags" class="edit-tags-list"></div>
        <div class="tag-add-row">
          <input id="tag-inp" type="text" class="tag-inp"
                 placeholder="Adicionar tag e pressionar Enter…"
                 onkeydown="tagKeydown(event)" autocomplete="off">
          <button class="tag-add-btn" onclick="addTag()" aria-label="Adicionar tag">+</button>
        </div>
      </div>

      <!-- Imagens -->
      <div class="editor-section">
        <div class="esec-label">Imagens</div>
        <div id="edit-imgs"></div>
        <button class="btn-img-add" id="btn-upload" onclick="pickImage()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          + Imagem
        </button>
      </div>

      <!-- Excluir (mobile) -->
      <button class="btn-del-nota" id="btn-del-nota" onclick="deleteNota()" style="display:none">
        Excluir esta nota
      </button>
    </div>

  </div><!-- /view-editor -->

</div><!-- /ano-cols -->

<!-- FAB -->
<button class="fab" id="fab" onclick="fabAction()" title="Novo">＋</button>

<!-- ── Panel: Formulário de caderno ── -->
<div class="overlay" id="form-overlay" onclick="closePanel('form')"></div>
<div class="panel" id="form-panel">
  <div class="panel-handle"></div>
  <div class="panel-title" id="cf-title">Novo caderno</div>
  <div class="panel-body">
    <div class="form-group">
      <label class="form-label">Nome *</label>
      <input class="form-input" id="cf-nome" type="text"
             placeholder="Ex: Fotografia, Maquiagem com Carol…"
             autocomplete="off" onkeydown="if(event.key==='Enter') saveCaderno()">
    </div>
    <div class="form-group">
      <label class="form-label">Ícone</label>
      <div id="emoji-picker" class="emoji-picker"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Cor</label>
      <div id="cor-picker" class="cor-picker"></div>
    </div>
    <button class="btn-primary" id="btn-save-cad" onclick="saveCaderno()">Salvar caderno</button>
    <button class="btn-outline" onclick="closePanel('form')">Cancelar</button>
    <button class="btn-danger" id="btn-del-cad" onclick="deleteCadernoFromForm()" style="display:none">Excluir caderno</button>
  </div>
</div>

<!-- ── Panel: Menu de opções do caderno ── -->
<div class="overlay" id="menu-overlay" onclick="closePanel('menu')"></div>
<div class="panel" id="menu-panel">
  <div class="panel-handle"></div>
  <div class="panel-body panel-body-menu">
    <button class="menu-action" onclick="editCadernoFromMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editar caderno
    </button>
    <button class="menu-action menu-danger" onclick="deleteCadernoFromMenu()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
      Excluir caderno
    </button>
    <button class="menu-action menu-cancel" onclick="closePanel('menu')">Cancelar</button>
  </div>
</div>

<!-- ── Panel: Lixeira ── -->
<div class="overlay" id="trash-overlay" onclick="closePanel('trash')"></div>
<div class="panel" id="trash-panel">
  <div class="panel-handle"></div>
  <div class="trash-hdr">
    <span class="panel-title trash-title">Lixeira</span>
    <button class="trash-empty-btn" id="trash-empty-btn" onclick="emptyTrash()" style="display:none">Esvaziar</button>
  </div>
  <div class="panel-body">
    <div id="trash-list"></div>
    <button class="btn-outline" onclick="closePanel('trash')">Fechar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /ano-app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="../shared/js/db.js?v=lixeira1"></script>
<script src="./scripts/anotacoes.js?v=lixeira1"></script>
<script src="../shared/js/global-search.js"></script>
<script src="../shared/js/global-notes.js?v=lixeira1"></script>
<script src="../shared/js/sidebar.js"></script>
<script src="../shared/js/alerts.js"></script>
</body>
</html>
