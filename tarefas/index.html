<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <title>Tarefas · Meu Studio</title>
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="./styles/tarefas.css">
</head>
<body>

<div id="tar-app">

<!-- ── SIDEBAR DESKTOP ── -->
<aside class="tar-d-sidebar">

  <div class="tar-d-brand">
    <div class="tar-d-brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <h2>Tarefas</h2>
  </div>

  <!-- Progress ring -->
  <div class="tar-d-prog">
    <svg width="40" height="40" viewBox="0 0 40 40">
      <circle class="tar-d-ring-bg" cx="20" cy="20" r="16"/>
      <circle class="tar-d-ring-fg" id="d-ring" cx="20" cy="20" r="16"/>
      <text x="20" y="20" class="tar-d-ring-txt" id="d-ring-pct">0%</text>
    </svg>
    <div>
      <div class="tar-d-prog-lbl" id="d-prog-lbl">Carregando...</div>
      <div class="tar-d-prog-val" id="d-prog-val"></div>
    </div>
  </div>

  <!-- Stats 2x2 -->
  <div class="tar-d-stats">
    <div class="tar-d-stat">
      <div class="tar-d-stat-lbl">Pendentes</div>
      <span class="tar-d-stat-val" id="d-s-pend">—</span>
    </div>
    <div class="tar-d-stat">
      <div class="tar-d-stat-lbl">Hoje</div>
      <span class="tar-d-stat-val c-hoje" id="d-s-hoje">—</span>
    </div>
    <div class="tar-d-stat">
      <div class="tar-d-stat-lbl">Atrasadas</div>
      <span class="tar-d-stat-val c-atrs" id="d-s-atrs">—</span>
    </div>
    <div class="tar-d-stat">
      <div class="tar-d-stat-lbl">Feitas</div>
      <span class="tar-d-stat-val c-ok" id="d-s-feitas">—</span>
    </div>
  </div>

  <!-- Quick-add -->
  <div class="tar-d-quick">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <input id="d-quick-inp" type="text" placeholder="Tarefa rápida..."
           onkeydown="if(event.key==='Enter') quickAddD()" autocomplete="off">
    <button class="tar-d-quick-btn" onclick="quickAddD()">↑</button>
  </div>

  <!-- Filtros -->
  <div class="tar-d-fil-lbl">Filtrar por</div>

  <button class="tar-d-fil active" data-f="pendentes" onclick="setF('pendentes')">
    <div class="tar-d-dot" style="background:#E57373"></div>
    <span class="tar-d-fil-name">Pendentes</span>
    <span class="tar-d-cnt" id="d-fc-pend">0</span>
  </button>
  <button class="tar-d-fil" data-f="hoje" onclick="setF('hoje')">
    <div class="tar-d-dot" style="background:#F9C784"></div>
    <span class="tar-d-fil-name">Hoje</span>
    <span class="tar-d-cnt" id="d-fc-hoje">0</span>
  </button>
  <button class="tar-d-fil" data-f="semana" onclick="setF('semana')">
    <div class="tar-d-dot" style="background:#90CAF9"></div>
    <span class="tar-d-fil-name">Esta semana</span>
    <span class="tar-d-cnt" id="d-fc-sem">0</span>
  </button>
  <button class="tar-d-fil" data-f="feitas" onclick="setF('feitas')">
    <div class="tar-d-dot" style="background:#A5D6A7"></div>
    <span class="tar-d-fil-name">✓ Feitas</span>
    <span class="tar-d-cnt" id="d-fc-feitas">0</span>
  </button>

</aside>

<!-- ── HEADER ── -->
<div class="hdr">
  <button class="hdr-back" onclick="window.location.href='../'" aria-label="Voltar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="hdr-center">
    <h1>Tarefas</h1>
    <div class="hdr-sub" id="hsub"></div>
  </div>
  <div class="hdr-right">
    <button class="hdr-back" onclick="load()" aria-label="Atualizar" title="Atualizar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
</div>

<!-- Barra de progresso (mobile) -->
<div class="progress-section">
  <div class="progress-info">
    <span class="progress-lbl" id="prog-lbl">Carregando...</span>
    <span class="progress-pct" id="prog-pct"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<!-- Chips (mobile) -->
<div class="chips">
  <div class="chip"><div class="chip-lbl">Pendentes</div><div class="chip-val" id="c-pend">—</div></div>
  <div class="chip"><div class="chip-lbl" style="color:#C62828">Hoje</div><div class="chip-val" id="c-hoje" style="color:#C62828">—</div></div>
  <div class="chip"><div class="chip-lbl" style="color:var(--amber)">Semana</div><div class="chip-val" id="c-semana" style="color:var(--amber)">—</div></div>
  <div class="chip"><div class="chip-lbl" style="color:var(--ok)">Feitas</div><div class="chip-val" id="c-feitas" style="color:var(--ok)">—</div></div>
</div>

<!-- Filtros (mobile) -->
<div class="ftabs">
  <button class="ftab on" data-f="pendentes" onclick="setF('pendentes')">Pendentes</button>
  <button class="ftab"    data-f="hoje"      onclick="setF('hoje')">Hoje</button>
  <button class="ftab"    data-f="semana"    onclick="setF('semana')">Esta semana</button>
  <button class="ftab"    data-f="feitas"    onclick="setF('feitas')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Feitas</button>
</div>

<!-- Quick add (mobile) -->
<div class="quick-add">
  <span class="quick-add-icon">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </span>
  <input id="quick-input" type="text" placeholder="Adicionar tarefa rápida..." autocomplete="off"
         onkeydown="if(event.key==='Enter') quickAdd()">
  <button class="quick-add-btn" onclick="quickAdd()">↑</button>
</div>

<!-- Desktop toolbar -->
<div class="tar-d-toolbar">
  <div>
    <div class="tar-d-toolbar-title" id="d-toolbar-title">Pendentes</div>
    <div class="tar-d-toolbar-sub" id="d-toolbar-sub"></div>
  </div>
  <button class="tar-d-nova-btn" onclick="openAdd()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nova tarefa
  </button>
</div>

<div class="content" id="content">
  <div class="loader"><div class="spinner"></div><br>Carregando tarefas...</div>
</div>

<button class="fab" onclick="openAdd()" title="Nova tarefa com detalhes">＋</button>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-title" id="p-title">Nova Tarefa</div>
  <div class="panel-body">
    <div class="form-group">
      <label class="form-label">Tarefa *</label>
      <input class="form-input" id="f-titulo" type="text"
             placeholder="Ex: Responder orçamentos, Comprar material..."
             autocomplete="off" onkeydown="if(event.key==='Enter') saveTask()">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Prazo</label>
        <input class="form-input" id="f-prazo" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Prioridade</label>
        <div class="toggle-row">
          <button class="prio-btn" id="f-prio-alta"   data-prio="alta"   onclick="setPrio(this)">Alta</button>
          <button class="prio-btn on" id="f-prio-normal" data-prio="normal" onclick="setPrio(this)">Normal</button>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="btn-save" onclick="saveTask()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Salvar tarefa
    </button>
    <button class="btn-outline" onclick="closePanel()">Cancelar</button>
    <button class="btn-danger"  id="btn-del"  onclick="deleteTask()">Excluir tarefa</button>
  </div>
</div>

<div class="toast" id="toast"></div>

</div><!-- /tar-app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="../shared/js/db.js"></script>
<script src="./scripts/tarefas.js"></script>
<script src="../shared/js/global-search.js"></script>
<script src="../shared/js/global-notes.js"></script>
<script src="../shared/js/sidebar.js"></script>
<script src="../shared/js/alerts.js"></script>
</body>
</html>
