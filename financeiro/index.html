<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Financeiro 💄">
    <title>💄 Financeiro</title>
    <style>
        :root {
            --brown:   #6d4c41;
            --brown-d: #3e2723;
            --brown-l: #efebe9;
            --ok:      #2d7d3a;
            --ok-d:    #1b5e20;
            --ok-l:    #e8f5e9;
            --red:     #c62828;
            --red-l:   #ffebee;
            --amber:   #f59e0b;
            --amber-l: #fff8e1;
            --blue:    #0d47a1;
            --blue-l:  #e3f2fd;
            --bg:      #f3ede8;
            --card:    #ffffff;
            --text:    #1a1a1a;
            --muted:   #6b7280;
            --border:  #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; max-width: 480px; margin: 0 auto;
        }

        /* ── HEADER ── */
        .hdr {
            background: linear-gradient(135deg, var(--brown-d), var(--brown));
            color: white; padding: 13px 18px 11px; position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
        }
        .hdr h1 { font-size: 1.1rem; font-weight: 700; }
        .hdr-sub { font-size: .72rem; opacity: .75; margin-top: 1px; }
        .hdr-right { display: flex; align-items: center; gap: 10px; }
        .sync-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #81c784;
            transition: background .3s;
        }
        .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
        .sync-dot.offline { background: var(--red-l); }
        .sync-dot.no-url  { background: #aaa; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .gear-btn {
            background: none; border: none; color: rgba(255,255,255,.8);
            font-size: 1.1rem; cursor: pointer; padding: 2px;
        }

        /* ── CONTENT ── */
        .content { padding: 13px 13px 86px; }

        /* ── BOTTOM NAV ── */
        .bnav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: white;
            border-top: 1px solid var(--border); display: flex; z-index: 100;
            box-shadow: 0 -2px 8px rgba(0,0,0,.07);
        }
        .ni {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 8px 0 6px; gap: 2px; cursor: pointer; color: var(--muted);
            font-size: .64rem; font-weight: 500; border: none; background: none;
        }
        .ni.active { color: var(--brown); }
        .ni svg { width: 20px; height: 20px; }

        /* ── CARD ── */
        .card { background: var(--card); border-radius: 13px; padding: 15px; margin-bottom: 11px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
        .card-title { font-size: .69rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 11px; }

        /* ── FORM ── */
        .fg { margin-bottom: 14px; }
        .fg:last-child { margin-bottom: 0; }
        .fl { display: block; font-size: .69rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
        .fi { width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: .93rem; color: var(--text); background: white; -webkit-appearance: none; appearance: none; transition: border-color .15s; }
        .fi:focus { outline: none; border-color: var(--brown); }
        .fi.ta { resize: none; height: 56px; line-height: 1.4; font-size: .88rem; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

        /* ── TOGGLE BUTTONS ── */
        .bg { display: flex; gap: 5px; flex-wrap: wrap; }
        .bt { flex: 1; min-width: 0; padding: 9px 6px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-size: .8rem; font-weight: 500; color: var(--text); cursor: pointer; text-align: center; transition: all .15s; white-space: nowrap; }
        .bt.on { border-color: var(--brown); background: var(--brown); color: white; font-weight: 600; }

        /* ── STATUS TOGGLE ── */
        .stog { display: flex; background: #f3f4f6; border-radius: 11px; padding: 3px; }
        .stbtn { flex: 1; padding: 9px; border: none; border-radius: 9px; font-size: .86rem; font-weight: 600; cursor: pointer; transition: all .2s; background: transparent; color: var(--muted); }
        .stbtn.on-g { background: var(--ok);   color: white; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
        .stbtn.on-r { background: var(--red);  color: white; box-shadow: 0 1px 4px rgba(0,0,0,.15); }

        /* ── VALUE INPUT ── */
        .vwrap { position: relative; }
        .vpfx { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--muted); font-size: .93rem; pointer-events: none; }
        .vwrap .fi { padding-left: 36px; font-size: 1.2rem; font-weight: 700; }

        /* ── SUBMIT ── */
        .bsub { width: 100%; padding: 14px; background: var(--brown); color: white; border: none; border-radius: 13px; font-size: .97rem; font-weight: 700; cursor: pointer; box-shadow: 0 3px 10px rgba(109,76,65,.3); }
        .bsub:active { background: var(--brown-d); }
        .bsub.red { background: var(--red); box-shadow: 0 3px 10px rgba(198,40,40,.3); }

        /* ── MONTH SELECTOR ── */
        .msel { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 13px; padding: 11px 15px; margin-bottom: 11px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
        .mnbtn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--brown); padding: 3px 7px; }
        .mlab { font-weight: 700; font-size: .97rem; text-align: center; }
        .msub { font-size: .69rem; color: var(--muted); margin-top: 1px; }

        /* ── FILTER TABS ── */
        .ftabs { display: flex; gap: 5px; margin-bottom: 11px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .ftabs::-webkit-scrollbar { display: none; }
        .ftab { padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-size: .75rem; font-weight: 500; cursor: pointer; white-space: nowrap; color: var(--text); }
        .ftab.on { background: var(--brown); border-color: var(--brown); color: white; font-weight: 600; }

        /* ── ENTRY ITEM ── */
        .eitem { background: white; border-radius: 12px; padding: 12px 13px; margin-bottom: 7px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; align-items: center; gap: 10px; }
        .eico { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .einf { flex: 1; min-width: 0; }
        .ecli { font-weight: 600; font-size: .89rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .emta { font-size: .7rem; color: var(--muted); margin-top: 2px; }
        .erig { text-align: right; flex-shrink: 0; }
        .eval { font-weight: 700; font-size: .93rem; }
        .sbadge { display: inline-block; font-size: .6rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; margin-top: 3px; text-transform: uppercase; cursor: pointer; user-select: none; }
        .sbadge:active { opacity: .7; }
        .sb-g { background: var(--ok-l);   color: var(--ok);   }
        .sb-r { background: var(--red-l);  color: var(--red);  }
        .sb-b { background: var(--blue-l); color: var(--blue); }
        .delbtn  { background: var(--red-l);   border: none; border-radius: 8px; color: var(--red);   width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: .85rem; }
        .editbtn { background: var(--brown-l); border: none; border-radius: 8px; color: var(--brown); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: .85rem; }

        /* ── EMPTY / LOADING ── */
        .empty { text-align: center; padding: 44px 16px; color: var(--muted); }
        .empty .ico { font-size: 2.6rem; margin-bottom: 9px; }
        .empty p { font-size: .85rem; line-height: 1.5; }

        /* ── SINAL BOX ── */
        .sinal-box { background: var(--amber-l); border: 1.5px dashed var(--amber); border-radius: 11px; padding: 12px 13px; margin-top: 9px; font-size: .8rem; color: #7c4a00; line-height: 1.5; display: none; }
        .sinal-box .rv { font-size: 1rem; font-weight: 800; color: var(--red); display: block; margin-top: 3px; }

        /* ── RESUMO ── */
        .rrow { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f3f4f6; font-size: .85rem; }
        .rrow:last-child { border-bottom: none; }
        .rrow .rlbl { color: var(--muted); }
        .rrow .rval { font-weight: 700; }
        .rrow.total .rlbl { font-weight: 700; color: var(--text); }
        .rsum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 11px; }
        .rsum-card { background: white; border-radius: 12px; padding: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .rsum-lbl { font-size: .67rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
        .rsum-val { font-size: 1.1rem; font-weight: 800; margin-top: 3px; }
        .rsum-cnt { font-size: .68rem; color: var(--muted); margin-top: 1px; }
        .mei-track { background: #e8ddd8; border-radius: 8px; height: 12px; overflow: hidden; margin: 8px 0 4px; }
        .mei-fill  { height: 12px; border-radius: 8px; transition: width .4s; }
        .barrow { margin-bottom: 10px; }
        .barrow:last-child { margin-bottom: 0; }
        .barhdr { display: flex; justify-content: space-between; font-size: .81rem; margin-bottom: 4px; }
        .barhdr span:last-child { font-weight: 700; }
        .btrk { background: #e8ddd8; border-radius: 4px; height: 6px; }
        .bfil { border-radius: 4px; height: 6px; transition: width .4s; }
        .year-table { width: 100%; border-collapse: collapse; font-size: .75rem; }
        .year-table th { background: var(--brown); color: white; padding: 6px 8px; font-weight: 700; font-size: .65rem; text-align: right; }
        .year-table th:first-child { text-align: left; border-radius: 6px 0 0 0; }
        .year-table th:last-child  { border-radius: 0 6px 0 0; }
        .year-table td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; text-align: right; }
        .year-table td:first-child { text-align: left; font-weight: 600; }
        .year-table tr.cur td { background: #f5ede8; font-weight: 700; }
        .year-table tr.tfoot td { background: var(--brown-l); font-weight: 800; color: var(--brown); border-top: 2px solid var(--brown); font-size: .78rem; }
        .year-table .pos { color: var(--ok); }
        .year-table .neg { color: var(--red); }

        /* ── SAÍDAS ADD BTN ── */
        .add-btn { width: 100%; padding: 12px; background: white; color: var(--red); border: 2px dashed #f48fb1; border-radius: 13px; font-size: .9rem; font-weight: 700; cursor: pointer; margin-bottom: 11px; }
        .add-btn.open { border-style: solid; background: var(--red-l); }
        .bexp { width: 100%; padding: 13px; background: white; color: var(--brown); border: 2px solid var(--brown); border-radius: 13px; font-size: .88rem; font-weight: 700; cursor: pointer; margin-top: 4px; }

        /* ── TOAST ── */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #222; color: white; padding: 9px 18px; border-radius: 22px; font-size: .8rem; z-index: 999; opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── CONFIG MODAL ── */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: white; border-radius: 18px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,.2); max-height: 88vh; overflow-y: auto; }
        .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .modal p  { font-size: .85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
        .modal .fi { margin-bottom: 10px; font-size: .85rem; }
        .modal .bsub { margin-bottom: 8px; font-size: .9rem; padding: 12px; }
        .modal .skip { width: 100%; padding: 11px; background: none; border: 1.5px solid var(--border); border-radius: 13px; font-size: .88rem; font-weight: 600; color: var(--muted); cursor: pointer; }
        .modal .step { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
        .modal .step-n { background: var(--brown); color: white; border-radius: 50%; width: 22px; height: 22px; min-width: 22px; display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; margin-top: 1px; }
        .modal .step p { margin-bottom: 0; font-size: .82rem; }
        .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .modal-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
        .modal-tab { flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border); background: white; font-size: .8rem; font-weight: 600; cursor: pointer; color: var(--muted); }
        .modal-tab.on { background: var(--brown); border-color: var(--brown); color: white; }

        /* ── LOADING OVERLAY ── */
        .loading-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 400; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--brown-l); border-top-color: var(--brown); border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay p { font-size: .85rem; color: var(--muted); }

        /* ── LOGIN SCREEN ── */
        .login-screen {
            position: fixed; inset: 0; z-index: 600;
            background: linear-gradient(160deg, var(--brown-d) 0%, var(--brown) 50%, #a1887f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
        .login-logo {
            text-align: center; margin-bottom: 32px; color: white;
        }
        .login-logo .icon { font-size: 3.2rem; display: block; margin-bottom: 8px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.3)); }
        .login-logo h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: .5px; }
        .login-logo p  { font-size: .85rem; opacity: .75; margin-top: 4px; }
        .login-card {
            background: white; border-radius: 20px; padding: 28px 24px;
            width: 100%; max-width: 380px;
            box-shadow: 0 12px 40px rgba(0,0,0,.25);
        }
        .login-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; color: var(--brown-d); }
        .login-field { margin-bottom: 14px; position: relative; }
        .login-field .fl { color: var(--brown); }
        .login-field .fi:focus { border-color: var(--brown); }
        .eye-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--muted);
            font-size: 1rem; padding: 4px; margin-top: 10px;
        }
        .login-remember {
            display: flex; align-items: center; gap: 8px;
            font-size: .82rem; color: var(--muted); margin-bottom: 18px; cursor: pointer;
        }
        .login-remember input { width: 16px; height: 16px; accent-color: var(--brown); cursor: pointer; }
        .login-error {
            background: var(--red-l); color: var(--red); border-radius: 9px;
            padding: 9px 12px; font-size: .82rem; font-weight: 600;
            margin-bottom: 14px; display: none;
        }
        .login-btn {
            width: 100%; padding: 14px; background: var(--brown); color: white;
            border: none; border-radius: 13px; font-size: 1rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(109,76,65,.35);
            transition: background .15s;
        }
        .login-btn:active { background: var(--brown-d); }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-8px)}
            40%{transform:translateX(8px)}
            60%{transform:translateX(-6px)}
            80%{transform:translateX(6px)}
        }
        .logout-btn {
            width: 100%; padding: 11px; background: none;
            border: 1.5px solid var(--red); border-radius: 13px;
            font-size: .88rem; font-weight: 700; color: var(--red);
            cursor: pointer; margin-top: 14px;
        }
        .logout-btn:active { background: var(--red-l); }

        /* ── FAB CHAT ── */
        .fab-chat {
            position: fixed; bottom: 90px; right: 16px; width: 52px; height: 52px;
            border-radius: 50%; background: var(--brown-d); color: white;
            border: none; font-size: 1.3rem; cursor: pointer; z-index: 200;
            box-shadow: 0 4px 14px rgba(62,39,35,.45);
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s;
        }
        .fab-chat:active { transform: scale(.91); }

        /* ── CHAT MODAL ── */
        .chat-modal {
            position: fixed; inset: 0; z-index: 700;
            display: none; flex-direction: column; background: var(--bg);
        }
        .chat-hdr {
            background: linear-gradient(135deg, var(--brown-d), var(--brown));
            color: white; padding: 13px 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-back { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; padding: 2px 6px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 14px 13px; }
        .chat-bubble-user {
            background: var(--brown); color: white;
            border-radius: 16px 16px 4px 16px;
            padding: 10px 13px; font-size: .86rem; line-height: 1.5;
            max-width: 85%; margin-left: auto; margin-bottom: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.12);
        }
        .chat-bubble-ai {
            background: white; color: var(--text);
            border-radius: 16px 16px 16px 4px;
            padding: 10px 13px; font-size: .86rem; line-height: 1.6;
            max-width: 90%; margin-bottom: 10px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        .chat-bubble-ai strong { font-weight: 700; color: var(--brown-d); }
        .chat-bubble-ai em { font-style: italic; }
        .chat-bubble-ai ul { margin: 6px 0 6px 16px; padding: 0; }
        .chat-bubble-ai ul li { margin-bottom: 3px; }
        .chat-bubble-ai .chat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--border); font-size: .84rem; gap: 8px; }
        .chat-bubble-ai .chat-row:last-child { border-bottom: none; }
        .chat-bubble-ai .chat-row .cr-name { flex: 1; color: var(--text); }
        .chat-bubble-ai .chat-row .cr-val  { font-weight: 700; color: var(--brown-d); white-space: nowrap; }
        .chat-bubble-ai .chat-row .cr-badge { font-size: .72rem; padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
        .chat-bubble-ai .chat-row .cr-badge.prev { background: var(--amber-l); color: #7c4a00; }
        .chat-bubble-ai .chat-row .cr-badge.real { background: var(--ok-l); color: var(--ok-d); }
        .chat-bubble-ai .chat-row .cr-badge.auto { background: var(--blue-l); color: var(--blue); }
        .chat-bubble-ai .chat-total { margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--brown-l); font-weight: 700; font-size: .92rem; color: var(--brown-d); display: flex; justify-content: space-between; }
        .chat-bubble-ai hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
        .chat-typing { display: none; align-items: center; gap: 5px; padding: 8px 14px; }
        .chat-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brown); animation: pulse .9s infinite; }
        .chat-dot:nth-child(2) { animation-delay: .2s; }
        .chat-dot:nth-child(3) { animation-delay: .4s; }
        .chat-bar {
            padding: 11px 13px; background: white;
            border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center;
        }
        .chat-bar .fi { flex: 1; margin: 0; font-size: .9rem; }
        .chat-send { width: 44px; height: 44px; border-radius: 11px; background: var(--brown); color: white; border: none; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
        .chat-send:disabled { opacity: .45; }
    </style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div class="login-screen" id="login-screen">
    <div class="login-logo">
        <span class="icon">💄</span>
        <h2>Financeiro</h2>
        <p>Controle financeiro pessoal</p>
    </div>
    <div class="login-card">
        <h3>Entrar na conta</h3>
        <div class="login-error" id="login-error">Usuário ou senha incorretos</div>
        <div class="login-field">
            <label class="fl">Usuário</label>
            <input class="fi" type="text" id="login-user" placeholder="seu usuário" autocomplete="username" autocapitalize="none">
        </div>
        <div class="login-field">
            <label class="fl">Senha</label>
            <input class="fi" type="password" id="login-pass" placeholder="••••••••••••" autocomplete="current-password" style="padding-right:44px">
            <button class="eye-btn" onclick="toggleEye()" id="eye-btn">👁</button>
        </div>
        <label class="login-remember">
            <input type="checkbox" id="login-remember"> Lembrar por 30 dias
        </label>
        <button class="login-btn" onclick="doLogin()">Entrar</button>
    </div>

<script>
// ══════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════
// Credenciais gerenciadas via Google Sheets (aba "senhas")

function checkAuth() {
    const session = localStorage.getItem('mk_session');
    if (session) {
        const { expires } = JSON.parse(session);
        if (Date.now() < expires) { showApp(); return; }
        localStorage.removeItem('mk_session');
    }
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    setTimeout(() => document.getElementById('login-user')?.focus(), 100);
}

async function doLogin() {
    const user = (document.getElementById('login-user').value || '').trim().toLowerCase();
    const pass = document.getElementById('login-pass').value || '';
    const remember = document.getElementById('login-remember').checked;
    const btn = document.querySelector('.login-btn');
    const err = document.getElementById('login-error');

    if (!user || !pass) {
        err.textContent = 'Preencha usuário e senha.';
        err.style.display = 'block';
        setTimeout(() => { err.style.display = 'none'; }, 3000);
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
        const resultado = await DB.auth.login(user, pass);
        if (resultado) {
            const expires = Date.now() + (remember ? 30 * 24 * 60 * 60 * 1000 : 8 * 60 * 60 * 1000);
            localStorage.setItem('mk_session', JSON.stringify({ expires, usuario: resultado.usuario, nivel: resultado.nivel }));
            showApp();
        } else {
            err.textContent = 'Usuário ou senha incorretos.';
            err.style.display = 'block';
            setTimeout(() => { err.style.display = 'none'; }, 3000);
            document.getElementById('login-pass').value = '';
            document.getElementById('login-pass').focus();
        }
    } catch(e) {
        err.textContent = 'Erro de conexão. Verifique sua internet.';
        err.style.display = 'block';
        setTimeout(() => { err.style.display = 'none'; }, 4000);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('loading-overlay').style.display = 'none';
    render();
    loadFromSupabase();
}

function doLogout() {
    localStorage.removeItem('mk_session');
    location.reload();
}

function toggleEye() {
    const inp = document.getElementById('login-pass');
    const btn = document.getElementById('eye-btn');
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
}

// ══════════════════════════════════════════
//  CONSTANTES
// ══════════════════════════════════════════
const MEI_LIMITE = 81000;
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const SAIDA_TIPOS = ['Reposição de Material','Curso','DAS','Assistente','Seguro de Celular','Investimento Produto','Investimento Material','Outro'];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let entries      = JSON.parse(localStorage.getItem('mk_entries') || '[]');
let saidas       = JSON.parse(localStorage.getItem('mk_saidas')  || '[]');
let noivas       = JSON.parse(localStorage.getItem('mk_noivas')  || '[]');
let screen       = 'nova';
let selMonth     = new Date().getMonth();
let selYear      = new Date().getFullYear();
let listFilter   = 'todos';
let saidasFormOpen = false;
let noivaDetail  = null;
let isSyncing    = false;
let F = {}, Fs = {};

function cacheNoivas() { localStorage.setItem('mk_noivas', JSON.stringify(noivas)); }
function normalizeN(n) { return { ...n, id: String(n.id||'') }; }

function initF()  {
    F  = { dataPag: today(), dataServ: '', cliente: '', tipo: 'Pagamento',
           valor: '', valorTotal: '', servico: 'Maquiagem', local: 'Studio',
           forma: 'PIX', status: 'Realizado', origem: 'Produção Social', obs: '' };
}
function initFs() {
    Fs = { dataPag: today(), valor: '', tipo: 'Reposição de Material',
           status: 'Pago', forma: 'PIX', obs: '' };
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function brl(v) {
    return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(s) {
    if (!s) return '—';
    const [y,m,d] = s.split('-'); return `${d}/${m}`;
}
function getMonthYear(ds) {
    if (!ds) return null;
    const [y,m] = ds.split('-');
    return { y: parseInt(y), m: parseInt(m)-1 };
}
function cacheEntries() { localStorage.setItem('mk_entries', JSON.stringify(entries)); }
function cacheSaidas()  { localStorage.setItem('mk_saidas',  JSON.stringify(saidas)); }
// Gerador de ID único — evita colisões em criações em sequência
function genId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
// Guards anti-duplo-clique (evitam salvar 2x se o usuário clicar rápido)
let _savingEntry = false;
let _savingSaida = false;
function toast(msg, dur) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur || 2400);
}

function typeStyle(t) {
    return { Sinal:{bg:'#fff3e0',col:'#bf360c',ico:'🔒'}, Pagamento:{bg:'#efebe9',col:'#4e342e',ico:'💸'}, Parcela:{bg:'#e3f2fd',col:'#0d47a1',ico:'📅'} }[t]
        || { bg:'#f5f5f5', col:'#666', ico:'💰' };
}
function saidaStyle(t) {
    return { 'DAS':{bg:'#fce4ec',col:'#880e4f',ico:'🏛'}, 'Curso':{bg:'#e3f2fd',col:'#0d47a1',ico:'📚'},
             'Assistente':{bg:'#f3e5f5',col:'#6a1b9a',ico:'👥'}, 'Seguro de Celular':{bg:'#e8eaf6',col:'#283593',ico:'📱'},
             'Reposição de Material':{bg:'#fff8e1',col:'#f57f17',ico:'🛍'},
             'Investimento Produto':{bg:'#e0f7fa',col:'#006064',ico:'💊'},
             'Investimento Material':{bg:'#efebe9',col:'#4e342e',ico:'📦'},
             'Outro':{bg:'#f5f5f5',col:'#424242',ico:'📌'} }[t]
        || { bg:'#f5f5f5', col:'#666', ico:'💰' };
}

// ══════════════════════════════════════════
//  SYNC DOT
// ══════════════════════════════════════════
function updateDot(state) {
    const dot = document.getElementById('sync-dot');
    dot.className = 'sync-dot ' + state;
    dot.title = { syncing:'Sincronizando...', ok:'Supabase sincronizado ✅', offline:'Sem conexão ⚠️' }[state] || '';
}

// ══════════════════════════════════════════
//  SUPABASE API
// ══════════════════════════════════════════
async function loadFromSupabase() {
    try {
        updateDot('syncing');
        isSyncing = true;
        const [ents, sais, novs] = await Promise.all([
            DB.entries.list(),
            DB.saidas.list(),
            DB.noivas.list(),
        ]);
        entries = ents.map(normalizeE);
        saidas  = sais.map(normalizeS);
        noivas  = novs.map(normalizeN);
        cacheEntries(); cacheSaidas(); cacheNoivas();
        updateDot('ok');
    } catch(e) {
        updateDot('offline');
        toast('📵 Supabase indisponível — usando dados locais');
    } finally {
        isSyncing = false;
        render();
        document.getElementById('loading-overlay').style.display = 'none';
    }
}

async function sbCall(params) {
    const { action, table, data, id, field, value } = params;
    try {
        updateDot('syncing');
        if (action === 'save' && data) {
            const obj = JSON.parse(decodeURIComponent(data));
            await DB[table].upsert(obj);
        } else if (action === 'delete' && id) {
            await DB[table].delete(id);
        } else if (action === 'update' && id && field) {
            await DB[table].update(id, { [field]: value });
        }
        updateDot('ok');
    } catch(e) {
        updateDot('offline');
        console.warn('sbCall error:', e.message);
    }
}

function normalizeE(e) { return { ...e, id: String(e.id||''), auto: e.auto==='true'||e.auto===true, noivaId: e.noivaId||'' }; }
function normalizeS(s) { return { ...s, id: String(s.id||'') }; }

// ══════════════════════════════════════════
//  NAVEGAÇÃO
// ══════════════════════════════════════════
function go(s) {
    screen = s;
    document.querySelectorAll('.ni').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-'+s).classList.add('active');
    document.getElementById('hsub').textContent =
        { nova:'Novo lançamento', lista:'Entradas', saidas:'Saídas', resumo:'Resumo', noivas:'Noivas 💍' }[s];
    render();
}

// ══════════════════════════════════════════
//  TOGGLE / SYNC FORM
// ══════════════════════════════════════════
function pick(field, value, form) {
    syncF();
    if (form === 's') Fs[field] = value;
    else F[field] = value;
    if (field === 'tipo') { render(); return; }
    document.querySelectorAll(`[data-f="${field}"][data-form="${form||'e'}"]`).forEach(btn => {
        const on = btn.dataset.v === value;
        if (field === 'status') {
            btn.classList.remove('on-g','on-r');
            if (on) btn.classList.add(value==='Realizado'||value==='Pago' ? 'on-g' : 'on-r');
        } else {
            btn.classList.toggle('on', on);
        }
    });
}
function syncF() {
    const r = (id, obj, f) => { const el=document.getElementById(id); if(el) obj[f]=el.value; };
    r('i-dp',F,'dataPag'); r('i-ds',F,'dataServ'); r('i-cl',F,'cliente');
    r('i-v',F,'valor');    r('i-vt',F,'valorTotal'); r('i-ob',F,'obs');
    r('si-dp',Fs,'dataPag'); r('si-v',Fs,'valor'); r('si-ob',Fs,'obs');
    const st = document.getElementById('si-tipo'); if(st) Fs.tipo = st.value;
}

// ══════════════════════════════════════════
//  RENDER ROUTER
// ══════════════════════════════════════════
function render() {
    const el = document.getElementById('content');
    if (screen==='nova')   el.innerHTML = renderNova();
    if (screen==='lista')  el.innerHTML = renderLista();
    if (screen==='saidas') el.innerHTML = renderSaidas();
    if (screen==='resumo') el.innerHTML = renderResumo();
    if (screen==='noivas') el.innerHTML = renderNoivas();
    bindAll();
}
function bindAll() {
    const on = (id, ev, fn) => { const e=document.getElementById(id); if(e) e.addEventListener(ev,fn); };
    on('i-dp','change',e=>F.dataPag=e.target.value);
    on('i-ds','change',e=>F.dataServ=e.target.value);
    on('i-cl','input', e=>F.cliente=e.target.value);
    on('i-v', 'input', e=>{F.valor=e.target.value; updateSinalPreview();});
    on('i-vt','input', e=>{
        F.valorTotal=e.target.value;
        // Auto-preenche sinal com 30% do total (editável)
        const total = Number(e.target.value);
        if (total > 0 && F.tipo === 'Sinal') {
            const sinal30 = (total * 0.30).toFixed(2);
            const vInput = document.getElementById('i-v');
            if (vInput) { vInput.value = sinal30; F.valor = sinal30; }
        }
        updateSinalPreview();
    });
    on('i-ds','change',()=>updateSinalPreview());
    on('i-ob','input', e=>F.obs=e.target.value);
    on('si-dp','change',e=>Fs.dataPag=e.target.value);
    on('si-v','input', e=>Fs.valor=e.target.value);
    on('si-ob','input',e=>Fs.obs=e.target.value);
    on('si-tipo','change',e=>Fs.tipo=e.target.value);
    // Scroll horizontal com mouse wheel no desktop
    const ftabs = document.querySelector('.ftabs');
    if (ftabs) {
        ftabs.addEventListener('wheel', e => {
            if (e.deltaY !== 0) { e.preventDefault(); ftabs.scrollLeft += e.deltaY; }
        }, { passive: false });
    }
}

// ══════════════════════════════════════════
//  SCREEN: NOVA ENTRADA
// ══════════════════════════════════════════
function bgroup(field, opts, form) {
    const frm = form||'e';
    return `<div class="bg">${opts.map(o => {
        const lbl=typeof o==='string'?o:o.l, val=typeof o==='string'?o:o.v;
        const cur=(frm==='s'?Fs:F)[field];
        return `<button class="bt ${cur===val?'on':''}" data-f="${field}" data-v="${val}" data-form="${frm}" onclick="pick('${field}','${val}','${frm}')">${lbl}</button>`;
    }).join('')}</div>`;
}
function renderNova() {
    return `
    <div class="card">
        <div class="fg">
            <label class="fl">Status</label>
            <div class="stog">
                <button class="stbtn ${F.status==='Realizado'?'on-g':''}" data-f="status" data-v="Realizado" data-form="e" onclick="pick('status','Realizado')">✅ Realizado</button>
                <button class="stbtn ${F.status==='Previsto'?'on-r':''}"  data-f="status" data-v="Previsto"  data-form="e" onclick="pick('status','Previsto')">🔮 Previsto</button>
            </div>
        </div>
        <div class="two">
            <div class="fg"><label class="fl">Dt. Pagamento</label><input class="fi" type="date" id="i-dp" value="${F.dataPag}"></div>
            <div class="fg"><label class="fl">Dt. Serviço</label><input class="fi" type="date" id="i-ds" value="${F.dataServ}"></div>
        </div>
        <div class="fg"><label class="fl">Nome da Cliente</label><input class="fi" type="text" id="i-cl" placeholder="Ex: Maria Silva" value="${F.cliente}" autocomplete="off"></div>
        <div class="fg"><label class="fl">Tipo de Entrada</label>${bgroup('tipo',['Sinal','Pagamento','Parcela'])}</div>
        ${F.tipo==='Sinal' ? `
        <div class="fg"><label class="fl">Valor Total do Serviço</label><div class="vwrap"><span class="vpfx">R$</span><input class="fi" type="number" id="i-vt" placeholder="0,00" step="0.01" min="0" value="${F.valorTotal}" inputmode="decimal"></div></div>
        <div class="fg"><label class="fl">Valor do Sinal</label><div class="vwrap"><span class="vpfx">R$</span><input class="fi" type="number" id="i-v" placeholder="0,00" step="0.01" min="0" value="${F.valor}" inputmode="decimal"></div></div>
        <div class="sinal-box" id="sinal-box"></div>
        ` : `
        <div class="fg"><label class="fl">Valor</label><div class="vwrap"><span class="vpfx">R$</span><input class="fi" type="number" id="i-v" placeholder="0,00" step="0.01" min="0" value="${F.valor}" inputmode="decimal"></div></div>
        `}
    </div>
    <div class="card">
        <div class="fg"><label class="fl">Serviço</label>${bgroup('servico',[{l:'Maquiagem',v:'Maquiagem'},{l:'Cabelo',v:'Cabelo'},{l:'Maq+Cab',v:'Maquiagem e Cabelo'},{l:'Curso Auto',v:'Curso de Automaquiagem'}])}</div>
        <div class="fg"><label class="fl">Local</label>${bgroup('local',['Studio','Em Domicílio'])}</div>
        <div class="fg"><label class="fl">Forma de Pagamento</label>${bgroup('forma',['PIX','Crédito','Dinheiro'])}</div>
        <div class="fg"><label class="fl">Origem</label>${bgroup('origem',['Produção Social','Noiva','Assistência',{l:'Curso Auto',v:'Curso de Automaquiagem'}])}</div>
        <div class="fg"><label class="fl">Observações</label><textarea class="fi ta" id="i-ob" placeholder="Opcional...">${F.obs}</textarea></div>
    </div>
    <button class="bsub" onclick="saveEntry()">💾 Salvar Lançamento</button>`;
}
function updateSinalPreview() {
    const box = document.getElementById('sinal-box');
    if (!box) return;
    const total = Number(document.getElementById('i-vt')?.value||0);
    const sinal = Number(document.getElementById('i-v')?.value||0);
    const ds    = document.getElementById('i-ds')?.value||'';
    const rest  = total - sinal;
    if (total>0 && sinal>0 && rest>0) {
        const d = ds ? ds.split('-').reverse().join('/') : '(data do serviço)';
        box.innerHTML = `🔮 Será criado automaticamente um <strong>Previsto</strong> de<span class="rv">${brl(rest)}</span>para ${d}`;
        box.style.display = 'block';
    } else box.style.display = 'none';
}

// ══════════════════════════════════════════
//  SCREEN: LISTA ENTRADAS
// ══════════════════════════════════════════
function renderLista() {
    let list = entries.filter(e => { const my=getMonthYear(e.dataPag); return my&&my.m===selMonth&&my.y===selYear; });
    if (listFilter!=='todos') list = list.filter(e=>e.status===listFilter||e.tipo===listFilter);
    list.sort((a,b)=>(b.dataPag||'').localeCompare(a.dataPag||''));
    const total = list.reduce((s,e)=>s+Number(e.valor||0),0);
    const filters = [{k:'todos',l:'Todos'},{k:'Realizado',l:'✅ Realizado'},{k:'Previsto',l:'🔮 Previsto'},{k:'Sinal',l:'🔒 Sinal'},{k:'Pagamento',l:'💸 Pagamento'},{k:'Parcela',l:'📅 Parcela'}];
    return `
    <div class="msel">
        <button class="mnbtn" onclick="chm(-1)">‹</button>
        <div class="mlab">${MONTHS[selMonth]} ${selYear}${list.length?`<div class="msub">${list.length} lançamento${list.length!==1?'s':''} · ${brl(total)}</div>`:''}</div>
        <button class="mnbtn" onclick="chm(1)">›</button>
    </div>
    <div class="ftabs">${filters.map(f=>`<button class="ftab ${listFilter===f.k?'on':''}" onclick="setF('${f.k}')">${f.l}</button>`).join('')}</div>

function renderResumo() {
    const me = entries.filter(e=>{const my=getMonthYear(e.dataPag);return my&&my.m===selMonth&&my.y===selYear;});
    const ms = saidas.filter(s=>{const my=getMonthYear(s.dataPag);return my&&my.m===selMonth&&my.y===selYear;});
    const fatReal = me.filter(e=>e.status==='Realizado').reduce((t,e)=>t+Number(e.valor||0),0);
    const fatPrev = me.filter(e=>e.status==='Previsto').reduce((t,e)=>t+Number(e.valor||0),0);
    const fatTotal= fatReal + fatPrev;
    const despPago= ms.filter(s=>s.status==='Pago').reduce((t,s)=>t+Number(s.valor||0),0);
    const despPrev= ms.filter(s=>s.status==='Previsto').reduce((t,s)=>t+Number(s.valor||0),0);
    const despTotal=despPago+despPrev;
    const lucroReal=fatReal-despPago, lucroTotal=fatTotal-despTotal;
    const margem=fatTotal>0?Math.round(lucroTotal/fatTotal*100):0;
    const byOri={}, bySai={};
    ['Produção Social','Noiva','Assistência'].forEach(o=>byOri[o]=me.filter(e=>e.origem===o).reduce((t,e)=>t+Number(e.valor||0),0));
    ms.forEach(s=>bySai[s.tipo]=(bySai[s.tipo]||0)+Number(s.valor||0));
    const meiAno = entries.filter(e=>{const my=getMonthYear(e.dataPag);return my&&my.y===selYear&&e.status==='Realizado';}).reduce((t,e)=>t+Number(e.valor||0),0);
    const meiPct = Math.min(100,Math.round(meiAno/MEI_LIMITE*100));
    const meiCor = meiPct<60?'var(--ok)':meiPct<85?'#f59e0b':'var(--red)';
    const meiRest= MEI_LIMITE-meiAno;
    const mesNow = selYear===new Date().getFullYear()?new Date().getMonth():11;
    const mesesR = 11-mesNow;
    function bar(lbl,val,tot,cor) {
        const pct=tot>0?Math.min(100,Math.round(val/tot*100)):0;
        if(!val) return '';
        return `<div class="barrow"><div class="barhdr"><span>${lbl}</span><span>${brl(val)}</span></div><div class="btrk"><div class="bfil" style="width:${pct}%;background:${cor||'var(--ok)'}"></div></div></div>`;
    }
    const fatAno=entries.filter(e=>{const my=getMonthYear(e.dataPag);return my&&my.y===selYear;}).reduce((t,e)=>t+Number(e.valor||0),0);
    const desAno=saidas.filter(s=>{const my=getMonthYear(s.dataPag);return my&&my.y===selYear;}).reduce((t,s)=>t+Number(s.valor||0),0);
    const anoRows=MONTHS_SHORT.map((m,i)=>{
        const em=entries.filter(e=>{const my=getMonthYear(e.dataPag);return my&&my.m===i&&my.y===selYear;});
        const sm=saidas.filter(s=>{const my=getMonthYear(s.dataPag);return my&&my.m===i&&my.y===selYear;});
        const fat=em.reduce((t,e)=>t+Number(e.valor||0),0);
        const des=sm.reduce((t,s)=>t+Number(s.valor||0),0);
        const luc=fat-des;
        const isCur=i===selMonth&&selYear===new Date().getFullYear();
        if(!fat&&!des) return `<tr${isCur?' class="cur"':''}><td>${m}</td><td>—</td><td>—</td><td>—</td></tr>`;
        return `<tr${isCur?' class="cur"':''}><td>${m}</td><td class="pos">${brl(fat).replace('R$ ','')}</td><td class="neg">${brl(des).replace('R$ ','')}</td><td class="${luc>=0?'pos':'neg'}">${brl(luc).replace('R$ ','')}</td></tr>`;
    });
    return `
    <div class="msel">
        <button class="mnbtn" onclick="chm(-1)">‹</button>
        <span class="mlab">${MONTHS[selMonth]} ${selYear}</span>
        <button class="mnbtn" onclick="chm(1)">›</button>
    </div>
    <div class="card">
        <div class="card-title">💰 Faturamento</div>
        <div class="rsum-grid" style="margin-bottom:11px">
            <div class="rsum-card" style="border-left:3px solid var(--ok)"><div class="rsum-lbl">Realizado</div><div class="rsum-val" style="color:var(--ok)">${brl(fatReal)}</div></div>
            <div class="rsum-card" style="border-left:3px solid var(--red)"><div class="rsum-lbl">Previsto</div><div class="rsum-val" style="color:var(--red)">${brl(fatPrev)}</div></div>
        </div>
        ${['Produção Social','Noiva','Assistência'].map(o=>bar(o,byOri[o],fatTotal,'var(--ok)')).join('')}
        <div class="rrow total" style="margin-top:8px;padding-top:10px;border-top:2px solid #f0f0f0"><span class="rlbl">TOTAL</span><span class="rval" style="font-size:1.05rem;color:var(--ok)">${brl(fatTotal)}</span></div>
    </div>
    <div class="card">
        <div class="card-title">🏛 Limite MEI ${selYear}</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
            <span style="font-size:.83rem;color:var(--muted)">Faturado: <strong style="color:${meiCor}">${brl(meiAno)}</strong></span>
            <span style="font-size:.83rem;font-weight:700;color:${meiCor}">${meiPct}%</span>
        </div>
        <div class="mei-track"><div class="mei-fill" style="width:${meiPct}%;background:${meiCor}"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-bottom:8px"><span>R$ 0</span><span>R$ 81.000</span></div>
        <div class="rrow"><span class="rlbl">Restante</span><span class="rval" style="color:${meiCor}">${brl(Math.max(0,meiRest))}</span></div>
        <div class="rrow"><span class="rlbl">Meta mensal (÷12)</span><span class="rval">${brl(MEI_LIMITE/12)}</span></div>
        ${mesesR>0&&selYear===new Date().getFullYear()?`<div class="rrow"><span class="rlbl">Margem p/ ${mesesR} meses restantes</span><span class="rval" style="color:${meiCor}">${brl(meiRest/mesesR)}/mês</span></div>`:''}
        ${meiPct>=85?`<div style="background:var(--red-l);color:var(--red);border-radius:9px;padding:9px 11px;font-size:.79rem;font-weight:600;margin-top:8px">⚠️ Atenção: ${meiPct}% do limite MEI atingido!</div>`:''}
    </div>
    <div class="card">
        <div class="card-title">📤 Saídas</div>
        <div class="rsum-grid" style="margin-bottom:11px">
            <div class="rsum-card" style="border-left:3px solid var(--red)"><div class="rsum-lbl">Pago</div><div class="rsum-val" style="color:var(--red)">${brl(despPago)}</div></div>
            <div class="rsum-card" style="border-left:3px solid var(--muted)"><div class="rsum-lbl">Previsto</div><div class="rsum-val" style="color:var(--muted)">${brl(despPrev)}</div></div>
        </div>
        ${Object.entries(bySai).map(([k,v])=>bar(saidaStyle(k).ico+' '+k,v,despTotal,'var(--red)')).join('')}
        <div class="rrow total" style="margin-top:8px;padding-top:10px;border-top:2px solid #f0f0f0"><span class="rlbl">TOTAL</span><span class="rval" style="font-size:1.05rem;color:var(--red)">${brl(despTotal)}</span></div>
    </div>
    <div class="card" style="background:linear-gradient(135deg,${lucroReal>=0?'#f1faf1,#e8f5e9':'#fff0f0,#ffebee'})">
        <div class="card-title">📊 Resultado do Mês</div>
        <div class="rrow"><span class="rlbl">Faturamento total</span><span class="rval">${brl(fatTotal)}</span></div>
        <div class="rrow"><span class="rlbl">Saídas totais</span><span class="rval" style="color:var(--red)">- ${brl(despTotal)}</span></div>
        <div class="rrow total" style="margin-top:6px;padding-top:10px;border-top:2px solid rgba(0,0,0,.08)"><span class="rlbl">LUCRO PREVISTO</span><span class="rval" style="font-size:1.1rem;color:${lucroTotal>=0?'var(--ok)':'var(--red)'}">${brl(lucroTotal)}</span></div>
        <div class="rrow total"><span class="rlbl">LUCRO REALIZADO</span><span class="rval" style="font-size:1.1rem;color:${lucroReal>=0?'var(--ok)':'var(--red)'}">${brl(lucroReal)}</span></div>
        <div style="text-align:center;margin-top:8px;font-size:1.5rem;font-weight:800;color:${lucroTotal>=0?'var(--ok)':'var(--red)'}">${margem}% margem</div>
    </div>
    <div class="card">
        <div class="card-title">📅 Visão Anual ${selYear}</div>
        <div style="overflow-x:auto">
        <table class="year-table">
            <tr><th>Mês</th><th>Faturamento</th><th>Saídas</th><th>Lucro</th></tr>
            ${anoRows.join('')}
            <tr class="tfoot"><td>ANO</td><td>${brl(fatAno).replace('R$ ','')}</td><td>${brl(desAno).replace('R$ ','')}</td><td class="${fatAno-desAno>=0?'pos':'neg'}">${brl(fatAno-desAno).replace('R$ ','')}</td></tr>
        </table></div>
    </div>
    ${(()=>{
        const byOri={};
        entries.filter(e=>{const my=getMonthYear(e.dataPag);return my&&my.y===selYear;})
            .forEach(e=>{ const o=e.origem||'Outros'; byOri[o]=(byOri[o]||0)+Number(e.valor||0); });
        const total=Object.values(byOri).reduce((a,b)=>a+b,0)||1;
        const cores={'Produção Social':'var(--brown)','Noiva':'#e91e63','Assistência':'#0d47a1','Curso de Automaquiagem':'#00796b','Outros':'var(--muted)'};
        const items=Object.entries(byOri).sort((a,b)=>b[1]-a[1]);
        if(!items.length) return '';
        return `<div class="card">
            <div class="card-title">📊 Faturamento por Origem — ${selYear}</div>
            ${items.map(([o,v])=>{
                const pct=Math.round(v/total*100);
                const cor=cores[o]||'var(--brown)';
                return `<div class="barrow"><div class="barhdr"><span>${o}</span><span>${brl(v)} <span style="color:var(--muted);font-weight:400">(${pct}%)</span></span></div>
                <div class="btrk"><div class="bfil" style="width:${pct}%;background:${cor}"></div></div></div>`;
            }).join('')}
        </div>`;
    })()}
    <button class="bexp" onclick="exportCSV()">📥 Exportar Entradas CSV</button>
    <button class="bexp" style="margin-top:8px" onclick="exportSaidasCSV()">📥 Exportar Saídas CSV</button>`;
}

async function saveEntry() {
    if (_savingEntry) return;            // anti duplo-clique
    _savingEntry = true;
    setTimeout(()=>{ _savingEntry = false; }, 600);

    syncF(); F.cliente = F.cliente.trim();
    if (!F.cliente)  { toast('⚠️ Informe o nome da cliente!'); return; }
    if (!F.dataPag)  { toast('⚠️ Informe a data!'); return; }
    if (!F.valor || Number(F.valor)<=0) { toast('⚠️ Informe um valor válido!'); return; }

    if (F.tipo === 'Sinal') {
        const sinal=Number(F.valor), total=Number(F.valorTotal);
        if (!F.valorTotal||total<=0) { toast('⚠️ Informe o valor total!'); return; }
        if (sinal>=total) { toast('⚠️ Sinal deve ser menor que o total!'); return; }
        const rest=total-sinal, datRest=F.dataServ||F.dataPag;
        const sinalId = genId();
        const e1={ id:sinalId, ...JSON.parse(JSON.stringify(F)), createdAt:new Date().toISOString() };
        const e2={ id:genId(), dataPag:datRest, dataServ:F.dataServ, cliente:F.cliente,
            tipo:'Pagamento', valor:rest.toFixed(2), valorTotal:'', servico:F.servico, local:F.local,
            forma:F.forma, status:'Previsto', origem:F.origem, obs:`Restante (sinal: ${brl(sinal)})`,
            auto:true, parentSinalId:sinalId, createdAt:new Date().toISOString() };
        entries.unshift(e2); entries.unshift(e1);
        cacheEntries(); render();
        toast(`✅ Sinal + Previsto de ${brl(rest)} criados!`);
        sbCall({action:'save', table:'entries', data: encodeURIComponent(JSON.stringify(e1))});
        sbCall({action:'save', table:'entries', data: encodeURIComponent(JSON.stringify(e2))});
    } else {
        const entry={ id:genId(), ...JSON.parse(JSON.stringify(F)), createdAt:new Date().toISOString() };
        entries.unshift(entry); cacheEntries(); render();
        toast('✅ Lançamento salvo!');
        sbCall({action:'save', table:'entries', data: encodeURIComponent(JSON.stringify(entry))});
    }
    const k={local:F.local, servico:F.servico, origem:F.origem, forma:F.forma};
    initF(); Object.assign(F, k);
    render();
}

async function delEntry(id) {
    const target = entries.find(e=>String(e.id)===String(id));
    // Se for um Sinal, procura o Previsto auto vinculado (parentSinalId)
    const filhoPrev = target && target.tipo==='Sinal'
        ? entries.find(e => String(e.parentSinalId||'')===String(target.id))
        : null;
    const msg = filhoPrev
        ? 'Excluir este Sinal? O Previsto auto vinculado também será removido.'
        : 'Excluir este lançamento?';
    if (!confirm(msg)) return;
    const idsParaApagar = new Set([String(id)]);
    if (filhoPrev) idsParaApagar.add(String(filhoPrev.id));
    entries = entries.filter(e => !idsParaApagar.has(String(e.id)));
    cacheEntries();
    idsParaApagar.forEach(delId => sbCall({action:'delete', table:'entries', id: delId}));
    if (target?.noivaId) recalcRestaNoiva(target.noivaId);
    render(); toast(filhoPrev ? '🗑 Sinal + Previsto excluídos' : '🗑 Excluído');
}

async function toggleStatus(id) {
    const e = entries.find(e=>String(e.id)===String(id));
    if (!e) return;
    e.status = e.status==='Realizado' ? 'Previsto' : 'Realizado';
    cacheEntries(); render();
    toast(e.status==='Realizado' ? '✅ Marcado como Realizado!' : '🔮 Marcado como Previsto');
    sbCall({action:'update', table:'entries', id, field:'status', value:e.status});
}

//  ACTIONS — SAÍDAS
// ══════════════════════════════════════════
function toggleSaidasForm() { syncF(); saidasFormOpen=!saidasFormOpen; render(); }

async function saveSaida() {
    if (_savingSaida) return;           // anti duplo-clique
    _savingSaida = true;
    setTimeout(()=>{ _savingSaida = false; }, 600);
    syncF();
    if (!Fs.valor||Number(Fs.valor)<=0) { toast('⚠️ Informe o valor!'); return; }
    if (!Fs.dataPag) { toast('⚠️ Informe a data!'); return; }
    const saida={ id:genId(), ...JSON.parse(JSON.stringify(Fs)), createdAt:new Date().toISOString() };
    saidas.unshift(saida); cacheSaidas();
    toast('✅ Saída salva!');
    const k={tipo:Fs.tipo, forma:Fs.forma}; initFs(); Object.assign(Fs,k);
    saidasFormOpen=false; render();
    sbCall({action:'save', table:'saidas', data: encodeURIComponent(JSON.stringify(saida))});
}

async function delSaida(id) {
    if (!confirm('Excluir?')) return;
    saidas=saidas.filter(s=>String(s.id)!==String(id));
    cacheSaidas(); render(); toast('🗑 Excluído');
    sbCall({action:'delete', table:'saidas', id});
}

async function toggleSaidaStatus(id) {
    const s=saidas.find(s=>s.id===id);
    if (!s) return;
    s.status=s.status==='Pago'?'Previsto':'Pago';
    cacheSaidas(); render();
    toast(s.status==='Pago'?'✅ Marcado como Pago!':'🔮 Marcado como Previsto');
    sbCall({action:'update', table:'saidas', id, field:'status', value:s.status});
}

function dl(csv, name) {
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});

// ── Recalcula a entrada "Restante Previsto" de uma noiva ──
// Aceita ID ou nome da noiva como fallback.
function recalcRestaNoiva(noivaIdOrNome) {
    if (!noivaIdOrNome) return;
    const noiva = noivas.find(n => n.id === noivaIdOrNome)
               || noivas.find(n => n.nome.trim().toLowerCase() === String(noivaIdOrNome).trim().toLowerCase());
    if (!noiva) return;
    const noivaId = noiva.id;
    const contrato = Number(noiva.valorContrato||0);

    // Soma todos os pagamentos NÃO-auto (os que o usuário registrou)
    const pgtos = entries.filter(e =>
        (e.noivaId === noivaId || (e.origem==='Noiva' && e.cliente.trim().toLowerCase()===noiva.nome.trim().toLowerCase()))
        && !(e.auto===true || e.auto==='true')
    );
    const totalPagos = pgtos.reduce((t,e) => t + Number(e.valor||0), 0);
    const restante   = Math.max(0, contrato - totalPagos);

    // Localiza a entrada auto (Restante Previsto)
    const autoIdx = entries.findIndex(e =>
        (e.noivaId === noivaId || (e.origem==='Noiva' && e.cliente.trim().toLowerCase()===noiva.nome.trim().toLowerCase()))
        && (e.auto===true || e.auto==='true') && e.status==='Previsto'
    );

    if (autoIdx >= 0) {
        const autoEntry = entries[autoIdx];
        if (restante <= 0.01) {
            // Contrato quitado — remove o restante
            entries.splice(autoIdx, 1);
            cacheEntries();
            sbCall({action:'delete', table:'entries', id: autoEntry.id});
        } else {
            // Atualiza o valor restante
            const updated = {...autoEntry, valor: String(restante),
                obs: `Restante do contrato — total pago até agora: ${brl(totalPagos)}`};
            entries[autoIdx] = updated;
            cacheEntries();
            sbCall({action:'delete', table:'entries', id: autoEntry.id});
            sbCall({action:'save',   table:'entries', data: encodeURIComponent(JSON.stringify(updated))});
        }
    } else if (restante > 0.01) {
        // Não existe entrada auto — cria uma (pode ter sido deletada manualmente)
        const nova = {
            id: genId(), dataPag: noiva.dataCasamento||today(),
            dataServ: noiva.dataCasamento||'', cliente: noiva.nome,
            tipo: 'Pagamento', valor: String(restante), valorTotal: String(contrato),
            servico: 'Maquiagem', local: 'Studio', forma: 'PIX',
            status: 'Previsto', origem: 'Noiva',
            obs: `Restante do contrato — total pago até agora: ${brl(totalPagos)}`,
            auto: true, createdAt: new Date().toISOString(), noivaId
        };
        entries.unshift(nova); cacheEntries();
        sbCall({action:'save', table:'entries', data: encodeURIComponent(JSON.stringify(nova))});
    }
}

function saveNoiva() {
    const nome       = document.getElementById('nv-nome').value.trim();
    const data       = document.getElementById('nv-data').value;
    const valor      = document.getElementById('nv-valor').value;
    const obs        = document.getElementById('nv-obs').value;
    const sinalValor = Number(document.getElementById('nv-sinal')?.value||0);
    const sinalData  = document.getElementById('nv-sinal-data')?.value || today();
    const sinalForma = document.getElementById('nv-forma-grp')?.dataset.val || 'PIX';
    const sinalSt    = document.getElementById('nv-sinal-status')?.value || 'Realizado';
    if (!nome)  { toast('⚠️ Informe o nome da noiva!'); return; }
    if (!valor||Number(valor)<=0) { toast('⚠️ Informe o valor do contrato!'); return; }
    const contrato = Number(valor);
    const noivaIdNew = genId();
    const noiva = { id:noivaIdNew, nome, dataCasamento:data, valorContrato:valor, obs, createdAt:new Date().toISOString() };
    noivas.unshift(noiva); cacheNoivas();
    sbCall({action:'save', table:'noivas', data:encodeURIComponent(JSON.stringify(noiva))});

    if (sinalValor > 0) {
        if (sinalValor > contrato) { toast('⚠️ Sinal maior que o contrato!'); return; }
        // Entrada: Sinal
        const sinalIdNoiva = genId();
        const sinalEntry = {
            id: sinalIdNoiva, dataPag: sinalData, dataServ: data||'',
            cliente: nome, tipo: 'Sinal', valor: String(sinalValor),
            valorTotal: valor, servico: 'Maquiagem', local: 'Studio',
            forma: sinalForma, status: sinalSt, origem: 'Noiva', obs: '',
            auto: false, createdAt: new Date().toISOString(), noivaId: noiva.id
        };
        entries.unshift(sinalEntry); cacheEntries();
        sbCall({action:'save', table:'entries', data:encodeURIComponent(JSON.stringify(sinalEntry))});
        // Entrada: Restante previsto
        const restante = contrato - sinalValor;
        if (restante > 0.01) {
            const restaEntry = {
                id: genId(), dataPag: data||today(), dataServ: data||'',
                cliente: nome, tipo: 'Pagamento', valor: String(restante),
                valorTotal: valor, servico: 'Maquiagem', local: 'Studio',
                forma: 'PIX', status: 'Previsto', origem: 'Noiva',
                obs: `Restante do contrato (sinal: ${brl(sinalValor)})`,
                auto: true, parentSinalId: sinalIdNoiva,
                createdAt: new Date().toISOString(), noivaId: noiva.id
            };
            entries.unshift(restaEntry); cacheEntries();
            sbCall({action:'save', table:'entries', data:encodeURIComponent(JSON.stringify(restaEntry))});
        }
        toast(`✅ Noiva cadastrada! Sinal ${brl(sinalValor)} + Restante ${brl(restante)} lançados.`);
    } else {
        toast('✅ Noiva cadastrada!');
    }
    noivaDetail = noiva.id;
    closeModal(); render();
}

function saveNoivaPgto(noivaId, nomeCli) {
    const valor  = document.getElementById('np-valor').value;
    const dataPag= document.getElementById('np-data').value;
    const status = document.getElementById('ed-status').value;
    const tipo   = _pick['npTipo']  || 'Parcela';
    const forma  = _pick['npForma'] || 'PIX';
    const obs    = document.getElementById('np-obs')?.value || '';
    if (!valor || Number(valor)<=0) { toast('⚠️ Informe o valor!'); return; }
    const noiva = noivas.find(n=>n.id===noivaId);
    if (noiva) {
        const contrato = Number(noiva.valorContrato||0);
        const pgtos = entries.filter(e=>
            (e.noivaId===noiva.id||(e.origem==='Noiva'&&e.cliente.trim().toLowerCase()===noiva.nome.trim().toLowerCase()))
            && !(e.auto===true||e.auto==='true'));
        const comprometido = pgtos.reduce((t,e)=>t+Number(e.valor||0),0);
        const disponivel = contrato - comprometido;
        if (Number(valor) > disponivel + 0.01) {
            toast(`⚠️ Valor excede o disponível: ${brl(Math.max(0,disponivel))}`); return;
        }
    }
    const entry = {
        id: genId(), dataPag, dataServ: noiva?.dataCasamento||'',
        cliente: nomeCli, tipo, valor: String(valor),
        valorTotal: noiva?.valorContrato||'', servico:'Maquiagem', local:'Studio',
        forma, status, origem:'Noiva', obs,
        auto: false, createdAt: new Date().toISOString(), noivaId
    };

function buildContext() {
    const now = new Date();
    const mAtual = MONTHS[selMonth] + ' ' + selYear;

    // Todas as entradas do mês selecionado (incluindo auto)
    const me = entries.filter(e=>{ const my=getMonthYear(e.dataPag); return my&&my.m===selMonth&&my.y===selYear; });

    // Totais COMPLETOS do mês — incluem entradas auto (Restante Previsto)
    const fatReal = me.filter(e=>e.status==='Realizado').reduce((t,e)=>t+Number(e.valor||0),0);
    const fatPrev = me.filter(e=>e.status==='Previsto').reduce((t,e)=>t+Number(e.valor||0),0);

    const ms = saidas.filter(s=>{ const my=getMonthYear(s.dataPag); return my&&my.m===selMonth&&my.y===selYear; });
    const despReal = ms.filter(s=>s.status==='Pago').reduce((t,s)=>t+Number(s.valor||0),0);
    const despPrev = ms.filter(s=>s.status==='Pendente').reduce((t,s)=>t+Number(s.valor||0),0);

    // Lista detalhada de TODAS as entradas do mês (para validação pelo chat)
    const entradasMes = me.map(e=>({
        id:e.id, data:e.dataPag, cliente:e.cliente, tipo:e.tipo,
        valor:Number(e.valor||0), status:e.status, origem:e.origem,
        forma:e.forma, auto:e.auto===true||e.auto==='true', noivaId:e.noivaId||''
    }));

    // Faturamento anual — inclui auto
    const anoEntries = entries.filter(e=>{ const my=getMonthYear(e.dataPag); return my&&my.y===selYear; });
    const fatAno = anoEntries.reduce((t,e)=>t+Number(e.valor||0),0);
    const fatAnoReal = anoEntries.filter(e=>e.status==='Realizado').reduce((t,e)=>t+Number(e.valor||0),0);
    const fatAnoPrev = anoEntries.filter(e=>e.status==='Previsto').reduce((t,e)=>t+Number(e.valor||0),0);

    const noivasCtx = noivas.map(n=>{
        const pg  = entries.filter(e=>e.noivaId===n.id||(e.origem==='Noiva'&&e.cliente.trim().toLowerCase()===n.nome.trim().toLowerCase()));
        const pgM = pg.filter(e=>!(e.auto===true||e.auto==='true'));
        const pago = pgM.filter(e=>e.status==='Realizado').reduce((t,e)=>t+Number(e.valor||0),0);
        const prev = pgM.filter(e=>e.status==='Previsto').reduce((t,e)=>t+Number(e.valor||0),0);
        const contrato = Number(n.valorContrato||0);
        const pagamentos = pg.map(e=>({id:e.id,tipo:e.tipo,valor:Number(e.valor||0),status:e.status,data:e.dataPag,forma:e.forma,auto:e.auto===true||e.auto==='true'}));
        return { id:n.id, nome:n.nome, contrato, pago, previsto:prev,
                 saldoRestante:Math.max(0,contrato-pago-prev),
                 dataCasamento:n.dataCasamento||'—', pagamentos };
    });

    // === ENTRADAS E TOTAIS AGRUPADOS POR MÊS (YYYY-MM) ===
    // Fonte AUTORITATIVA para qualquer pergunta sobre valores de um mês específico,
    // seja o mês atual ou qualquer outro. Inclui entradas auto=true.
    const entradasPorMes = {};
    const resumoPorMes = {};
    entries.forEach(e => {
        if (!e.dataPag || typeof e.dataPag !== 'string') return;
        const k = e.dataPag.slice(0,7);
        if (!/^\d{4}-\d{2}$/.test(k)) return;
        if (!entradasPorMes[k]) entradasPorMes[k] = [];
        entradasPorMes[k].push({
            id:e.id, data:e.dataPag, cliente:e.cliente, tipo:e.tipo,
            valor:Number(e.valor||0), status:e.status, origem:e.origem,
            forma:e.forma, auto:e.auto===true||e.auto==='true', noivaId:e.noivaId||''
        });
    });
    Object.keys(entradasPorMes).forEach(k => {
        const arr = entradasPorMes[k];
        const real = arr.filter(x=>x.status==='Realizado').reduce((t,x)=>t+x.valor,0);
        const prev = arr.filter(x=>x.status==='Previsto').reduce((t,x)=>t+x.valor,0);
        resumoPorMes[k] = {
            fatReal: real, fatPrev: prev, fatTotal: real+prev,
            qtdEntradas: arr.length,
            qtdReal: arr.filter(x=>x.status==='Realizado').length,
            qtdPrev: arr.filter(x=>x.status==='Previsto').length
        };
    });

    // Chave YYYY-MM do mês exibido na UI (para a IA mapear "este mês" / "mês atual")
    const mesAtualKey = `${selYear}-${String(selMonth+1).padStart(2,'0')}`;

    // Mapa de nomes PT-BR → número do mês (ajuda a IA a converter "junho" → "06")
    const mapaMeses = {
        janeiro:'01', fevereiro:'02', marco:'03', 'março':'03', abril:'04',
        maio:'05', junho:'06', julho:'07', agosto:'08', setembro:'09',
        outubro:'10', novembro:'11', dezembro:'12'
    };

    // Lista geral de entradas recentes — APENAS para perguntas que não envolvem
    // um mês específico (ex: "últimos lançamentos"). NÃO use para somar mês.
    const ultimasEntradas = [...entries]
        .sort((a,b)=>(b.dataPag||'').localeCompare(a.dataPag||'')||b.createdAt?.localeCompare(a.createdAt)||0)
        .slice(0,40)
        .map(e=>({id:e.id,data:e.dataPag,cliente:e.cliente,tipo:e.tipo,
                  valor:Number(e.valor||0),status:e.status,origem:e.origem,
                  forma:e.forma,auto:e.auto===true||e.auto==='true',noivaId:e.noivaId||''}));

    const ultimasSaidas = [...saidas]
        .sort((a,b)=>b.createdAt?.localeCompare(a.createdAt)||0)
        .slice(0,10)
        .map(s=>({id:s.id,data:s.dataPag,tipo:s.tipo,valor:Number(s.valor||0),status:s.status,forma:s.forma}));

    return JSON.stringify({
        hoje: now.toISOString().slice(0,10),
        mesAtual: mAtual,
        mesAtualKey,
        mapaMeses,
        resumoMes: {
            fatReal, fatPrev, despReal, despPrev, lucro:fatReal-despReal,
            totalEntradas: entradasMes.length
        },
        resumoPorMes,
        entradasMes,
        entradasPorMes,
        fatAno, fatAnoReal, fatAnoPrev,
        noivas: noivasCtx,
        ultimasEntradas,
        ultimasSaidas
    }, null, 0);
}

async function callClaudeAPI(messages) {
    const apiKey = localStorage.getItem('mk_claude_key') || '';
    if (!apiKey) throw new Error('Chave da API Claude não configurada. Acesse ⚙️ → Claude IA e cole sua sk-ant-key.');

    const ctx = buildContext();
    const systemPrompt = `Você é a assistente financeira pessoal de uma maquiadora autônoma chamada Carol.
Você tem acesso aos dados financeiros dela em tempo real e pode criar, editar e excluir lançamentos.

DADOS ATUAIS (JSON):
${ctx}

REGRAS OBRIGATÓRIAS:
1. Para cadastrar noiva com sinal: use SOMENTE add_noiva (com campos sinal_*). NUNCA chame add_entrada logo depois.
2. Para adicionar parcela/pagamento a noiva já cadastrada: use add_entrada com noivaId correto.
3. Pagamentos de noiva NUNCA devem ultrapassar o valor do contrato (campo saldoRestante nos dados).
4. O campo noivaId é OBRIGATÓRIO quando origem="Noiva". Use o ID exato que está nos dados.
5. Responda sempre em português brasileiro, de forma amigável e direta.
6. Após executar uma ação, confirme o que foi feito e mostre o saldo atualizado se relevante.
7. Para excluir ou editar uma entrada, use SEMPRE o campo "id" exato da entrada listada nos dados. Entradas com mesmo valor mas tipos diferentes (ex: Sinal vs Parcela) têm IDs diferentes — use o tipo para diferenciar.
8. Entradas com auto=true são geradas pelo sistema (Restante Previsto de noiva) — NUNCA as exclua diretamente.

REGRA FUNDAMENTAL — ENTRADAS AUTO:
As entradas com auto=true representam o saldo restante previsto de contratos de noivas. Elas são tão reais quanto as manuais e DEVEM ser incluídas em TODOS os cálculos e listagens, sem exceção, independente do tipo de pergunta:
- "valor previsto do mês" → inclui auto=true com status=Previsto
- "valor realizado do mês" → inclui auto=true com status=Realizado (se existirem)
- "sinais do mês" → inclui entradas auto=true com tipo=Sinal (se existirem)
- "parcelas do mês" → inclui entradas auto=true com tipo=Parcela (se existirem)
- "quanto falta receber de [noiva]" → usa dados de noivas.pagamentos que inclui auto
- "faturamento total" → soma TUDO, auto e manual
Nunca filtre ou ignore entradas pelo campo auto ao calcular totais ou listar lançamentos.

FONTE DE DADOS POR MÊS — REGRA INEGOCIÁVEL:
9. Para QUALQUER pergunta sobre valor previsto, realizado ou total de UM MÊS específico (atual, passado ou futuro), siga RIGOROSAMENTE este passo a passo. NÃO some valores manualmente — os totais já vêm calculados.

   PASSO 1 — Identifique o mês perguntado:
   - Se o usuário citou um mês ("junho", "julho de 2026", "este mês", "mês passado"), use-o.
   - Se NÃO citou mês algum, use mesAtualKey.

   PASSO 2 — Monte a chave no formato "YYYY-MM":
   - Use mapaMeses para converter o nome do mês em número (junho → "06").
   - Para o ano: se o usuário não disse ano, use o ano de mesAtualKey. Se o mês perguntado for ANTERIOR ao mês de mesAtualKey, ainda assim use o ano de mesAtualKey (não assuma ano anterior, salvo se o usuário explicitar).
   - Exemplos com mesAtualKey="2026-05":
       "junho"           → "2026-06"
       "julho de 2026"   → "2026-07"
       "este mês"/"atual"→ "2026-05"
       "mês passado"    → "2026-04"

   PASSO 3 — Leia os totais PRÉ-CALCULADOS em resumoPorMes[chave]:
   - resumoPorMes[chave].fatPrev   = valor PREVISTO total daquele mês
   - resumoPorMes[chave].fatReal   = valor REALIZADO total daquele mês
   - resumoPorMes[chave].fatTotal  = previsto + realizado
   - resumoPorMes[chave].qtdEntradas = total de lançamentos no mês

   PASSO 4 — Para listar as entradas que compõem o total, use entradasPorMes[chave].
   Cada item já tem cliente, valor, status, tipo, auto. NÃO use entradasMes nem ultimasEntradas para isso.

   PASSO 5 — Se resumoPorMes[chave] for undefined (mês sem lançamentos), responda exatamente:
   "Não há lançamentos cadastrados para [Mês] de [Ano]." E NÃO mostre dados de outro mês.

10. PROIBIÇÕES:
    - NUNCA use entradasMes para responder sobre um mês citado pelo usuário — entradasMes é apenas o mês EXIBIDO na UI e pode não corresponder ao mês perguntado.
    - NUNCA use ultimasEntradas para somar ou listar entradas de um mês específico — ela é limitada a 40 itens recentes e está incompleta para qualquer mês.
    - ultimasEntradas serve APENAS para perguntas sem mês definido, como "últimos lançamentos" ou "qual a entrada mais recente".

11. EXEMPLO COMPLETO — pergunta: "qual o valor previsto para junho?"

14. Sanidade — se você se vir somando valores um a um, PARE: leia o total já pronto em resumoPorMes[chave]. Soma manual está proibida porque introduz erros.

15. resumoMes (sem "Por") permanece referindo-se ao mês exibido na UI (mesAtualKey) e é equivalente a resumoPorMes[mesAtualKey]. Pode usar qualquer um dos dois para o mês atual.

FORMATO DAS RESPOSTAS:
