<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Financeiro">
    <title>Financeiro · Meu Studio</title>
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="./styles/financeiro.css">
    <!-- Fiscal CSS: estilos do fluxo de import (modal, revisão).
         Todos seletores com prefixo .fs- não conflitam. -->
    <link rel="stylesheet" href="./styles/fiscal.css">
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div class="login-screen" id="login-screen">
    <div class="login-logo">
        <span class="icon" style="color:var(--brown);display:flex;justify-content:center">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 5l2.8 9.4L32 17l-9.2 2.6L20 29l-2.8-9.4L8 17l9.2-2.6z"/>
            <path d="M30 28l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
          </svg>
        </span>
        <h2>Financeiro</h2>
        <p>Controle financeiro pessoal</p>
    </div>
    <div class="login-card">
        <h3>Entrar na conta</h3>
        <div class="login-error" id="login-error">Usuário ou senha incorretos</div>
        <div class="login-field">
            <label class="fl">Usuário</label>
            <input class="fi" type="text" id="login-user" placeholder="seu usuário" autocomplete="username" autocapitalize="none">
        </div>
        <div class="login-field">
            <label class="fl">Senha</label>
            <input class="fi" type="password" id="login-pass" placeholder="••••••••••••" autocomplete="current-password" style="padding-right:44px">
            <button class="eye-btn" onclick="toggleEye()" id="eye-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <label class="login-remember">
            <input type="checkbox" id="login-remember"> Lembrar por 30 dias
        </label>
        <button class="login-btn" onclick="doLogin()">Entrar</button>
    </div>
</div>

<!-- ── APP (oculto até autenticar) ── -->
<div id="app" style="display:none">

<button class="btn-back-float" onclick="window.location.href='../'" aria-label="Voltar">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
</button>

<div class="hdr">
    <div></div>
    <div class="hdr-center">
        <h1>Financeiro</h1>
        <div class="hdr-sub" id="hsub">Resumo</div>
    </div>
    <div class="hdr-right">
        <button class="gear-btn" onclick="openGlobalSearch()" title="Buscar (atalho: /)" aria-label="Buscar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="gear-btn" onclick="loadFromSupabase()" title="Atualizar" aria-label="Atualizar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="gear-btn" onclick="openConfig()" title="Configurações" aria-label="Configurações">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </button>
    </div>
</div>

<div class="content" id="content"></div>

<nav class="bnav">
    <button class="ni active" id="nav-resumo" onclick="go('resumo')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Resumo
    </button>
    <button class="ni" id="nav-lista"  onclick="go('lista')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
        Entradas
    </button>
    <button class="ni" id="nav-saidas" onclick="go('saidas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        Saídas
    </button>
    <button class="ni" id="nav-noivas" onclick="go('noivas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>
        Noivas
    </button>
    <button class="ni" id="nav-fiscal" onclick="window.location.href='./fiscal.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Fiscal
    </button>
</nav>

</div><!-- /app -->

<!-- FAB Chat -->
<button class="fab-chat" id="fab-chat" onclick="openChat()" title="Assistente IA">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
</button>

<!-- Chat Modal -->
<div class="chat-modal" id="chat-modal">
    <div class="chat-hdr">
        <button class="chat-back" onclick="closeChat()">←</button>
        <div style="flex:1">
            <div style="font-weight:700;font-size:1rem;display:flex;align-items:center;gap:7px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Assistente Financeira</div>
            <div style="font-size:.7rem;opacity:.75">Powered by Claude · acesso aos seus dados</div>
        </div>
        <button onclick="chatHistory=[];renderChatMessages()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:.78rem;cursor:pointer">Limpar</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-typing" id="chat-typing">
        <div class="chat-dot"></div><div class="chat-dot"></div><div class="chat-dot"></div>
        <span style="font-size:.78rem;color:var(--muted);margin-left:4px">Claude está pensando...</span>
    </div>
    <div class="chat-bar">
        <input class="fi" type="text" id="chat-input" placeholder="Ex: quanto faturei esse mês?" autocomplete="off"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}">
        <button class="chat-send" id="chat-send" onclick="sendChat()">↑</button>
    </div>
</div>

<div class="toast" id="toast"></div>
<div class="undo-toast" id="undo-toast"></div>

<!-- Loading overlay (inicial) -->
<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <p>Carregando dados...</p>
</div>

<!-- Config modal -->
<div class="modal-bg" id="modal-bg" style="display:none">
    <div class="modal" id="modal-inner"></div>
</div>

<!-- Fiscal/Import modal — reaproveitado pela importação de extrato -->
<div class="fs-modal-bg" id="fs-modal-bg" style="display:none">
    <div class="fs-modal" id="fs-modal-inner"></div>
</div>
<div class="fs-toast" id="fs-toast"></div>

<!-- ── Dependências externas + infra compartilhada ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="../shared/js/db.js"></script>
<script src="../shared/js/icons.js"></script>
<script src="../shared/js/calc-fiscal.js"></script>

<!-- ── Módulo Financeiro (ordem importa) ── -->
<script src="./scripts/state.js"></script>
<script src="./scripts/utils.js"></script>
<script src="./scripts/auth.js"></script>
<script src="./scripts/api.js"></script>
<script src="./scripts/handlers.js"></script>
<script src="./scripts/noivas.js"></script>
<script src="./scripts/modals.js"></script>
<script src="./scripts/views.js"></script>
<script src="./scripts/chat.js"></script>
<script src="./scripts/main.js"></script>

<!-- ── Import bancário (fluxo movido para a aba Saídas) ── -->
<script src="./scripts/fiscal/fiscal-state.js"></script>
<script src="./scripts/fiscal/fiscal-categorias.js"></script>
<script src="./scripts/fiscal/fiscal-parser.js"></script>
<script src="./scripts/fiscal/fiscal-categorizer.js"></script>
<script src="./scripts/fiscal/fiscal-import.js"></script>
<script src="./scripts/fiscal/fiscal-main.js"></script>

<!-- ── Sidebar (último, depende de DOM pronto) ── -->
<script src="../shared/js/global-search.js"></script>
<script src="../shared/js/global-notes.js"></script>
<script src="../shared/js/sidebar.js"></script>
</body>
</html>
