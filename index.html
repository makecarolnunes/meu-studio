<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meu Studio">
  <title>@makecarolnunes Studio</title>
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/base.css">
  <link rel="stylesheet" href="hub-assets/styles/hub.css?v=2026061201">
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 5l2.8 9.4L32 17l-9.2 2.6L20 29l-2.8-9.4L8 17l9.2-2.6z"/>
          <path d="M30 28l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
        </svg>
      </div>
      <div class="login-logo-title">@makecarolnunes Studio</div>
      <div class="login-logo-sub">Entre para continuar</div>
    </div>
    <input class="login-field" type="text"     id="login-user" placeholder="Usuário" autocomplete="username">
    <input class="login-field" type="password" id="login-pass" placeholder="Senha"   autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()">
    <label class="login-remember">
      <input type="checkbox" id="login-remember"> Lembrar por 30 dias
    </label>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- HUB (oculto até autenticar) -->
<div id="hub-app" style="display:none">
<div class="wrap">

  <!-- HEADER -->
  <div class="hero">
    <div class="hero-title">@makecarolnunes <span>Studio</span></div>
    <div class="hero-date" id="hero-date"></div>
  </div>

  <div class="body">

    <!-- OPERAÇÃO -->
    <div class="section-lbl">Operação diária</div>
    <div class="sys-grid" id="ops-grid"></div>

    <!-- ORGANIZAÇÃO (tarefas + anotações) -->
    <div class="section-lbl">Organização</div>
    <div class="sys-grid" id="org-grid"></div>
    <div id="todo-section" style="display:none">
      <div class="todo-hub-card" id="todo-widget"></div>
    </div>

    <!-- CONTEÚDO -->
    <div class="section-lbl">Conteúdo</div>
    <div class="sys-grid" id="creative-section"></div>

    <!-- PERFORMANCE -->
    <div class="section-lbl">Performance</div>
    <div class="sys-grid" id="performance-section"></div>

    <!-- MARCA -->
    <div class="section-lbl">Marca</div>
    <div class="sys-grid" id="marca-section"></div>

    <!-- PESQUISA -->
    <div class="section-lbl">Pesquisa</div>
    <div class="sys-grid" id="pesquisa-section"></div>

    <!-- GESTÃO -->
    <div class="section-lbl">Gestão</div>
    <div class="sys-grid" id="gestao-grid"></div>

  </div>

  <div class="footer">
    @makecarolnunes Studio · Painel central
    · <a href="#" onclick="doLogout();return false;" style="color:var(--muted);font-size:.75rem;">Sair</a>
  </div>

</div><!-- /hub-app -->
</div><!-- /wrap -->


<!-- ── Dependências externas + infra compartilhada ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared/js/db.js"></script>
<script src="shared/js/sidebar.js"></script>
<script src="shared/js/alerts.js"></script>

<!-- ── Hub ── -->
<script src="hub-assets/scripts/hub.js?v=2026061801"></script>
</body>
</html>
