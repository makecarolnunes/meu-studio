<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meu Studio">
  <title>@makecarolnunes Studio</title>
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    :root {
      /* Aliases para nomes legados do Hub → tokens em design-tokens.css
         (--bg, --text, --border, --rose, --amber, --green, --brown já vêm
         dos tokens globais com os mesmos nomes) */
      --card:     var(--surface);
      --muted:    var(--text-muted);
      --subtle:   var(--text-subtle);
      --rose-l:   var(--rose-soft);
      --rose-d:   var(--rose-dark);
      --amber-l:  var(--amber-soft);
      --amber-m:  #FAC775;            /* hub-only: estado syncing do pill */
      --amber-d:  var(--amber-dark);
      --green-l:  var(--green-soft);
      --brown-l:  var(--brown-soft);
      --mauve-l:  var(--mauve-soft);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 48px;
    }

    /* ─── HEADER ─────────────────────────────────── */
    .hero {
      background: #38190b;
      color: white;
      padding: 32px 20px 28px;
      border-radius: 0 0 22px 22px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .hero-title {
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .hero-title span { color: #F4C0D1; }
    .hero-date {
      font-size: 12px;
      color: rgba(255,255,255,0.42);
      text-transform: capitalize;
    }

    /* ─── BODY ───────────────────────────────────── */
    .body { padding: 22px 16px 0; }

    /* ─── SECTION LABELS ─────────────────────────── */
    .section-lbl {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 12px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .section-lbl:first-of-type { margin-top: 6px; }
    .section-lbl::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }
    .section-lbl-creative { color: var(--amber); }

    /* ─── GRID — mobile first: 1 coluna ─────────── */
    .sys-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ─── ORÇAMENTOS — card horizontal de destaque ─ */
    .card-orca {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.18s;
      -webkit-user-select: none;
    }
    .card-orca:hover  { border-color: var(--rose); }
    .card-orca:active { transform: scale(0.99); }

    .card-orca .sys-icon-wrap {
      width: 50px; height: 50px;
      border-radius: 13px;
      font-size: 22px;
      background: var(--rose-l);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .orca-text { flex: 1; min-width: 0; }
    .orca-badge {
      display: inline-block;
      background: var(--rose-l);
      color: var(--rose-d);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 5px;
    }
    .card-orca .sys-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
    }
    .card-orca .sys-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .card-orca .sys-arrow {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--bg);
      border: 0.5px solid var(--border);
      color: var(--rose);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }


    /* ─── SECONDARY CARDS — mobile: horizontal list ─ */
    .sys-card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      text-decoration: none;
      color: var(--text);
      display: grid;
      grid-template-columns: 46px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 12px;
      min-height: 72px;
      align-content: center;
      transition: border-color 0.18s;
      -webkit-user-select: none;
    }
    .sys-card:hover  { border-color: var(--accent, var(--rose)); }
    .sys-card:active { transform: scale(0.99); }

    .sys-icon-wrap {
      grid-column: 1; grid-row: 1 / 3;
      align-self: center;
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      background: var(--icon-bg, #F5F5F5);
    }
    .sys-name {
      grid-column: 2; grid-row: 1;
      align-self: end;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      padding-bottom: 2px;
    }
    .sys-desc {
      grid-column: 2; grid-row: 2;
      align-self: start;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .sys-arrow {
      grid-column: 3; grid-row: 1 / 3;
      align-self: center;
      font-size: 15px;
      color: var(--subtle);
      display: flex; align-items: center;
    }
    .sys-arrow .lbl { display: none; }

    /* Card variants */
    .card-fin    { --accent: var(--green);  --icon-bg: var(--green-l);  }
    .card-client { --accent: var(--brown);  --icon-bg: var(--brown-l);  }
    .card-conf   { --accent: var(--rose-d); --icon-bg: var(--mauve-l);  }

    /* ─── SVG icons (substituem emojis) ──────────── */
    .sys-icon-wrap { color: var(--accent, var(--rose)); }
    .sys-icon-wrap svg { width: 20px; height: 20px; display: block; }
    .card-orca .sys-icon-wrap { color: var(--rose); }
    .card-orca .sys-icon-wrap svg { width: 24px; height: 24px; }

    /* ─── Hover lift (iOS-like) ──────────────────── */
    .card-orca, .sys-card, .creative-card {
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card-orca:hover  { box-shadow: var(--shadow-sm); }
    .sys-card:hover   { box-shadow: var(--shadow-sm); }
    .creative-card:hover { box-shadow: var(--shadow-sm); }

    /* ─── Setas circulares (substituem &#8594; texto) ─── */
    .sys-arrow svg { width: 14px; height: 14px; display: block; }
    .card-orca .sys-arrow svg { width: 15px; height: 15px; }
    .creative-arrow svg { width: 16px; height: 16px; display: block; }

    /* sys-card mobile: deixa a seta circular como o card-orca */
    .sys-card .sys-arrow {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--bg);
      border: 0.5px solid var(--border);
      color: var(--accent, var(--subtle));
      justify-content: center;
    }

    /* ─── CONTEÚDO ───────────────────────────────── */
    .creative-section {
      background: #FFFCF8;
      border: 0.5px solid #EDD5A7;
      border-radius: 14px;
      padding: 12px;
    }
    .creative-card {
      background: var(--card);
      border-radius: 10px;
      border: 0.5px solid #F0E6D0;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 64px;
      transition: border-color 0.18s;
      -webkit-user-select: none;
    }
    .creative-card:hover  { border-color: var(--amber); }
    .creative-card:active { transform: scale(0.99); }
    .creative-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--amber-l);
      color: var(--amber);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .creative-icon svg { width: 20px; height: 20px; display: block; }
    .creative-text { flex: 1; min-width: 0; }
    .creative-name { font-size: 14px; font-weight: 500; }
    .creative-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .creative-arrow { font-size: 16px; color: var(--amber); flex-shrink: 0; }

    /* ─── HINT ───────────────────────────────────── */
    .hint-card {
      background: var(--card);
      border-radius: 12px;
      border: 0.5px solid var(--border);
      border-left: 2px solid #EDD5A7;
      padding: 13px 15px;
      margin-top: 16px;
    }
    .hint-text { font-size: 12px; color: var(--muted); line-height: 1.65; }
    .hint-text strong { color: var(--brown); font-weight: 500; }

    /* ─── FOOTER ─────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--subtle);
      padding: 22px 20px 0;
      line-height: 1.7;
    }

    /* ─── TABLET 600px+ — grid vertical ─────────── */
    @media (min-width: 600px) {
      .wrap { max-width: 700px; }
      .hero { padding: 36px 28px 30px; border-radius: 0 0 24px 24px; }
      .hero-title { font-size: 26px; }
      .body { padding: 26px 24px 0; }

      .sys-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .card-orca { grid-column: 1 / -1; }

      /* Reset secondary cards to vertical */
      .sys-card {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 16px 16px;
        min-height: 130px;
        grid-template-columns: unset;
      }
      .sys-icon-wrap {
        grid-column: unset; grid-row: unset;
        align-self: unset;
        width: 38px; height: 38px;
        margin-bottom: 11px;
      }
      .sys-name {
        grid-column: unset; grid-row: unset;
        align-self: unset;
        font-size: 13px;
        padding-bottom: 0;
        margin-bottom: 3px;
      }
      .sys-desc {
        grid-column: unset; grid-row: unset;
        align-self: unset;
        flex: 1;
        font-size: 11px;
      }
      .sys-arrow {
        grid-column: unset; grid-row: unset;
        align-self: unset;
        margin-top: 12px;
        font-size: 11px;
        color: var(--subtle);
      }
      .sys-arrow .lbl { display: inline; }
    }

    /* ─── DESKTOP 860px+ ──────────────────────────── */
    @media (min-width: 860px) {
      .wrap { max-width: 860px; }
      .hero { padding: 40px 32px 32px; }
      .hero-title { font-size: 28px; }
      .body { padding: 28px 28px 0; }

      .sys-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }

      .card-orca { padding: 22px 24px 20px; }
      .card-orca .sys-icon-wrap { width: 54px; height: 54px; font-size: 24px; border-radius: 14px; }
      .card-orca .sys-name { font-size: 17px; }
      .card-orca .sys-desc { font-size: 13px; }

      .sys-card { min-height: 140px; padding: 20px 18px 18px; }
      .sys-icon-wrap { width: 40px; height: 40px; font-size: 19px; }
      .sys-name { font-size: 14px; }
      .sys-desc { font-size: 12px; }

      .creative-section { padding: 14px 16px; }
      .creative-card { padding: 16px 18px; }
    }

    /* ─── TELAS MUITO PEQUENAS < 360px ─────────────── */
    @media (max-width: 359px) {
      .hero-title { font-size: 19px; }
      .body { padding: 18px 14px 0; }
      .card-orca { padding: 16px 14px; gap: 12px; }
      .card-orca .sys-icon-wrap { width: 44px; height: 44px; font-size: 20px; }
    }

    /* ─── LOGIN OVERLAY ─────────────────────────────── */
    #login-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-box { max-width: 360px; width: 100%; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo-icon { color: var(--rose); display: flex; justify-content: center; }
    .login-logo-icon svg { width: 40px; height: 40px; display: block; }
    .login-logo-title { font-size: 1.3rem; font-weight: 700; color: var(--text); margin-top: 10px; }
    .login-logo-sub { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .login-field {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: .95rem; background: var(--card);
      color: var(--text);
      margin-bottom: 12px; outline: none;
      -webkit-appearance: none;
    }
    .login-field:focus { border-color: var(--rose); }
    .login-remember { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); margin-bottom: 18px; cursor: pointer; }
    .login-btn {
      width: 100%; padding: 14px;
      background: var(--rose); color: white;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-err {
      margin-top: 12px;
      background: #fce4ec; color: #880e4f;
      border-radius: 10px; padding: 10px 14px;
      font-size: .85rem; display: none; text-align: center;
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 5l2.8 9.4L32 17l-9.2 2.6L20 29l-2.8-9.4L8 17l9.2-2.6z"/>
          <path d="M30 28l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
        </svg>
      </div>
      <div class="login-logo-title">@makecarolnunes Studio</div>
      <div class="login-logo-sub">Entre para continuar</div>
    </div>
    <input class="login-field" type="text"     id="login-user" placeholder="Usuário" autocomplete="username">
    <input class="login-field" type="password" id="login-pass" placeholder="Senha"   autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()">
    <label class="login-remember">
      <input type="checkbox" id="login-remember"> Lembrar por 30 dias
    </label>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- HUB (oculto até autenticar) -->
<div id="hub-app" style="display:none">
<div class="wrap">

  <!-- HEADER -->
  <div class="hero">
    <div class="hero-title">@makecarolnunes <span>Studio</span></div>
    <div class="hero-date" id="hero-date"></div>
  </div>

  <div class="body">

    <!-- OPERAÇÃO -->
    <div class="section-lbl">Operação diária</div>
    <div class="sys-grid" id="ops-grid"></div>

    <!-- CONTEÚDO -->
    <div class="section-lbl section-lbl-creative">Conteúdo</div>
    <div class="creative-section" id="creative-section"></div>

  </div>

  <div class="footer">
    @makecarolnunes Studio · Painel central
    · <a href="#" onclick="doLogout();return false;" style="color:var(--muted);font-size:.75rem;">Sair</a>
  </div>

</div><!-- /hub-app -->
</div><!-- /wrap -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="sidebar.js"></script>
<script>
  // ══════════════════════════════════════════════════════════
  //  HUB — busca links dos sistemas no Apps Script da planilha
  // ══════════════════════════════════════════════════════════

  var ORDER_OPS = ['orcamentos', 'financeiro', 'clientes', 'agendamentos'];

  var FALLBACK = [
    { nome: 'Orçamentos',   descricao: 'Início do fluxo — feche tudo em um clique', icone: '💰', url: 'orcamentos/',   cor: 'purple'       },
    { nome: 'Financeiro',   descricao: 'Entradas, saídas e resumo do mês',          icone: '💵', url: 'financeiro/',   cor: 'green'        },
    { nome: 'Clientes',     descricao: 'Atendimentos realizados e previstos',       icone: '👥', url: 'clientes/',     cor: 'brown'        },
    { nome: 'Agendamentos', descricao: 'Confirmação avulsa de agenda',              icone: '📅', url: 'confirmacao/',  cor: 'purple-light' },
    { nome: 'Conteúdo',     descricao: 'Planejamento de posts e ideias',            icone: '📱', url: 'conteudo/',     cor: 'amber'        },
  ];

  // ── UTILS ──
  function safeJSON(s, fb) { try { return s ? JSON.parse(s) : fb; } catch(e) { return fb; } }
  function pad(n) { return String(n).padStart(2,'0'); }
  function todayStr() {
    var t = new Date();
    return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
  }
  function setSync(state, text) {
    var pill = document.getElementById('sync-pill');
    pill.className = 'sync-pill ' + (state || '');
    document.getElementById('sync-text').textContent = text || '';
  }
  function norm(s) {
    return String(s || '')
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().trim();
  }
  function keyFor(item) {
    var n = norm(item.nome || item.name || item.titulo || '');
    if (n.indexOf('orcamento') >= 0) return 'orcamentos';
    if (n.indexOf('financ')    >= 0) return 'financeiro';
    if (n.indexOf('client')    >= 0) return 'clientes';
    if (n.indexOf('agendam')   >= 0) return 'agendamentos';
    if (n.indexOf('confirma')  >= 0) return 'agendamentos';
    if (n.indexOf('conteudo')  >= 0) return 'conteudo';
    if (n.indexOf('content')   >= 0) return 'conteudo';
    return n;
  }
  function normItem(raw) {
    return {
      nome:      raw.nome      || raw.name      || raw.titulo     || raw.title       || '',
      descricao: raw.descricao || raw.descrição  || raw.descricao_ || raw.description || raw.desc || '',
      icone:     raw.icone     || raw.ícone      || raw.icon       || '🌸',
      url:       raw.url       || raw.link       || raw.href       || '',
      cor:       raw.cor       || raw.color      || ''
    };
  }

  // ── SVG icons (Feather-style, 1.5 stroke) ──
  var ICONS = {
    orcamentos:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="8" y="3" width="8" height="3" rx="1"/>' +
        '<path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/>' +
        '<path d="M8 12h8M8 16h5"/>' +
      '</svg>',
    financeiro:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M20 12V8a2 2 0 0 0-2-2H5a1 1 0 0 1 0-2h13"/>' +
        '<path d="M3 5v14a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2v-4"/>' +
        '<circle cx="17" cy="14" r="1.5"/>' +
      '</svg>',
    clientes:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>' +
        '<circle cx="9" cy="7" r="4"/>' +
        '<path d="M22 21v-2a4 4 0 0 0-3-3.87"/>' +
        '<path d="M16 3.13a4 4 0 0 1 0 7.75"/>' +
      '</svg>',
    agendamentos:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="3" y="5" width="18" height="16" rx="2"/>' +
        '<path d="M16 3v4M8 3v4M3 10h18"/>' +
      '</svg>',
    conteudo:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 3l1.6 5L19 9.5 13.6 11 12 16l-1.6-5L5 9.5 10.4 8z"/>' +
        '<path d="M19 15l.7 2.3 2.3.7-2.3.7L19 21l-.7-2.3-2.3-.7 2.3-.7z"/>' +
      '</svg>',
    arrow:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M5 12h14M13 6l6 6-6 6"/>' +
      '</svg>'
  };
  function iconSvg(key) { return ICONS[key] || ICONS.arrow; }

  // ── Renderiza os cards ──
  function buildCards(systems) {
    var byKey = {};
    systems.forEach(function(raw) {
      var item = normItem(raw);
      if (!item.nome) return;
      byKey[keyFor(item)] = item;
    });

    if (!byKey.orcamentos) byKey.orcamentos = normItem(FALLBACK[0]);
    if (!byKey.orcamentos.url) byKey.orcamentos.url = 'orcamentos/';

    // ── Operação ──
    var opsHtml = '';
    ORDER_OPS.forEach(function(k) {
      var item = byKey[k];
      if (!item) {
        var fb = FALLBACK.find(function(f){ return keyFor(f) === k; });
        if (!fb) return;
        item = normItem(fb);
      }

      if (k === 'orcamentos') {
        opsHtml +=
          '<a href="' + esc(item.url) + '" class="card-orca">' +
            '<div class="sys-icon-wrap">' + iconSvg('orcamentos') + '</div>' +
            '<div class="orca-text">' +
              '<div class="orca-badge">Principal</div>' +
              '<div class="sys-name">' + esc(item.nome || 'Orçamentos') + '</div>' +
              '<div class="sys-desc">' + esc(item.descricao || 'Início do fluxo — feche tudo em um clique') + '</div>' +
            '</div>' +
            '<div class="sys-arrow">' + iconSvg('arrow') + '</div>' +
          '</a>';
      } else {
        var cls =
          k === 'financeiro'   ? 'card-fin'    :
          k === 'clientes'     ? 'card-client' :
          k === 'agendamentos' ? 'card-conf'   : '';
        var defaultDesc =
          k === 'financeiro'   ? 'Entradas e saídas do mês'     :
          k === 'clientes'     ? 'Atendimentos previstos'       :
          k === 'agendamentos' ? 'Confirmação avulsa de agenda' : '';
        opsHtml +=
          '<a href="' + esc(item.url) + '" class="sys-card ' + cls + '">' +
            '<div class="sys-icon-wrap">' + iconSvg(k) + '</div>' +
            '<div class="sys-name">' + esc(item.nome) + '</div>' +
            '<div class="sys-desc">' + esc(item.descricao || defaultDesc) + '</div>' +
            '<div class="sys-arrow">' + iconSvg('arrow') + '</div>' +
          '</a>';
      }
    });
    document.getElementById('ops-grid').innerHTML = opsHtml;

    // ── Conteúdo ──
    var cont = byKey.conteudo;
    if (!cont) {
      var fbCont = FALLBACK.find(function(f){ return keyFor(f) === 'conteudo'; });
      if (fbCont) cont = normItem(fbCont);
    }
    if (cont) {
      document.getElementById('creative-section').innerHTML =
        '<a href="' + esc(cont.url) + '" class="creative-card">' +
          '<div class="creative-icon">' + iconSvg('conteudo') + '</div>' +
          '<div class="creative-text">' +
            '<div class="creative-name">' + esc(cont.nome || 'Conteúdo') + '</div>' +
            '<div class="creative-desc">' + esc(cont.descricao || 'Planejamento de posts e ideias') + '</div>' +
          '</div>' +
          '<span class="creative-arrow">' + iconSvg('arrow') + '</span>' +
        '</a>';
    } else {
      document.getElementById('creative-section').innerHTML =
        '<div style="text-align:center;padding:14px;color:var(--muted);font-size:12px;">Sem itens de conteúdo cadastrados na planilha.</div>';
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Carrega os cards (somente FALLBACK — sem GAS) ──
  function loadHub() {
    localStorage.removeItem('hub_systems');
    buildCards(FALLBACK);
  }

  // ── Data ──
  (function init() {
    var now   = new Date();
    var DIAS  = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    document.getElementById('hero-date').textContent =
      DIAS[now.getDay()] + ', ' + now.getDate() + ' de ' + MESES[now.getMonth()] + ' de ' + now.getFullYear();

    checkAuth();
  })();

  // ── AUTH ──────────────────────────────────────────────────
  function checkAuth() {
    var s = localStorage.getItem('mk_session');
    if (s) {
      try {
        var sess = JSON.parse(s);
        if (Date.now() < sess.expires) { showHub(); return; }
      } catch(e) {}
      localStorage.removeItem('mk_session');
    }
    showLogin();
  }

  function showLogin() {
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('hub-app').style.display = 'none';
    setTimeout(function() { var u = document.getElementById('login-user'); if(u) u.focus(); }, 100);
  }

  function showHub() {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('hub-app').style.display = 'block';
    loadHub();
  }

  async function doLogin() {
    var user = (document.getElementById('login-user').value || '').trim().toLowerCase();
    var pass = document.getElementById('login-pass').value || '';
    var remember = document.getElementById('login-remember').checked;
    var btn = document.getElementById('login-btn');
    if (!user || !pass) { showErr('Preencha usuário e senha.'); return; }
    btn.disabled = true; btn.textContent = 'Verificando...';

    // Diagnóstico: verifica pré-requisitos antes de chamar Supabase
    if (typeof DB === 'undefined') {
      var diagMsg = 'Erro interno: DB não definido.';
      if (typeof supabase === 'undefined') diagMsg = 'Erro: CDN supabase-js não carregou (sem internet?).';
      else if (!window.ENV || !window.ENV.SUPABASE_URL) diagMsg = 'Erro: config.js sem SUPABASE_URL — configure os Secrets no GitHub.';
      showErr(diagMsg);
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }
    if (window._SB_ERROR) {
      showErr('Erro Supabase: ' + window._SB_ERROR);
      btn.disabled = false; btn.textContent = 'Entrar';
      return;
    }

    try {
      var resultado = await DB.auth.login(user, pass);
      if (resultado) {
        var expires = Date.now() + (remember ? 30*24*60*60*1000 : 8*60*60*1000);
        localStorage.setItem('mk_session', JSON.stringify({ expires: expires, usuario: resultado.usuario, nivel: resultado.nivel }));
        showHub();
      } else {
        showErr('Usuário ou senha incorretos.');
        document.getElementById('login-pass').value = '';
        document.getElementById('login-pass').focus();
      }
    } catch(e) {
      console.error('[doLogin] erro:', e);
      var msg = (e && e.message) ? e.message : String(e);
      showErr('Erro: ' + msg);
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }

  function doLogout() {
    localStorage.removeItem('mk_session');
    showLogin();
  }

  function showErr(msg) {
    var e = document.getElementById('login-err');
    e.textContent = msg; e.style.display = 'block';
    setTimeout(function() { e.style.display = 'none'; }, 3000);
  }
</script>
</body>
</html>
