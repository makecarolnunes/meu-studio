<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meu dinheiro">
  <title>Meu dinheiro · Meu Studio</title>
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="./styles/fluxo.css?v=20261116">
</head>
<body>

<div id="loading" class="loading"><div class="spinner"></div></div>

<header class="topo">
  <div class="topo-l">
    <h1>Meu dinheiro</h1>
    <div class="mes-nav">
      <button onclick="chMes(-1)" aria-label="Mês anterior">‹</button>
      <span id="mes-label">—</span>
      <button onclick="chMes(1)" aria-label="Próximo mês">›</button>
    </div>
  </div>
  <div class="topo-r">
    <button class="ico" onclick="recarregar()" title="Atualizar" aria-label="Atualizar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button class="ico" onclick="go('ajustes')" title="Ajustes" aria-label="Ajustes">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="8" cy="18" r="2" fill="var(--bg)"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabs">
  <button data-tab="mes" onclick="go('mes')">Mês</button>
  <button data-tab="plano" onclick="go('plano')">Plano</button>
  <button data-tab="movs" onclick="go('movs')">Movimentos</button>
  <button data-tab="caixinhas" onclick="go('caixinhas')">Caixinhas</button>
  <button data-tab="pendencias" onclick="go('pendencias')">Pendências<i id="badge-pend" class="badge" style="display:none"></i></button>
  <button data-tab="dividas" onclick="go('dividas')">Dívidas</button>
  <button data-tab="analises" onclick="go('analises')">Análises</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
  <div id="modal-box" class="modal-box"></div>
</div>
<div id="toast" class="toast"></div>

<!-- Ordem obrigatória: supabase → config → db → módulo → sidebar -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=2026053102"></script>
<script src="../shared/js/db.js?v=20261116"></script>
<script src="./scripts/modelo.js?v=20261116"></script>
<script src="./scripts/core.js?v=20261116"></script>
<script src="./scripts/store.js?v=20261116"></script>
<script src="./scripts/acoes.js?v=20261116"></script>
<script src="./scripts/extrato-parser.js?v=20261116"></script>
<script src="./scripts/ui.js?v=20261116"></script>
<script src="./scripts/telas.js?v=20261116"></script>
<script src="./scripts/forms.js?v=20261116"></script>
<script src="./scripts/main.js?v=20261116"></script>
<script src="../shared/js/sidebar.js?v=20261116"></script>
</body>
</html>
