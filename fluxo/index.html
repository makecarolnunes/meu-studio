<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meu dinheiro">
  <meta name="theme-color" content="#F8F7F5">
  <title>Meu dinheiro · Meu Studio</title>
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="./styles/fluxo.css?v=20261119n">
</head>
<body>

<div id="loading" class="loading"><div class="spinner"></div></div>

<!-- Computador: menu lateral (gerado por renderNav a partir de NAV em ui.js) -->
<aside id="lateral" class="lateral" aria-label="Seções do Meu dinheiro"></aside>

<div class="principal">
  <header class="topo">
    <div class="topo-l">
      <div id="seg-ent" class="seg-ent" role="group" aria-label="Pessoal ou empresa"></div>
    </div>
    <div class="topo-r">
      <div class="mes-nav">
        <button onclick="chMes(-1)" aria-label="Mês anterior">‹</button>
        <span id="mes-label">—</span>
        <button onclick="chMes(1)" aria-label="Próximo mês">›</button>
      </div>
      <button class="ico ico-at" onclick="recarregar()" title="Atualizar" aria-label="Atualizar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </header>
  <!-- Troca rápida entre os módulos de dinheiro (mesma chave no Financeiro) -->
  <nav class="mod-sw" aria-label="Módulos de dinheiro"><a href="../financeiro/">Financeiro</a><a class="on" aria-current="page">Meu dinheiro</a></nav>

  <main id="view" class="view"></main>
</div>

<!-- Celular: barra inferior (mesmas seções do menu lateral) + botão Registrar -->
<nav id="tabs" class="tabs" aria-label="Seções"></nav>
<button class="fab" onclick="menuNovo()" aria-label="Registrar gasto, reserva ou entrada">+</button>

<!-- Não fecha ao tocar fora: só pelo Cancelar/Fechar (evita perder o que foi digitado) -->
<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div id="modal-box" class="modal-box"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Ordem obrigatória: supabase → config → db → módulo → sidebar -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=2026053102"></script>
<script src="../shared/js/db.js?v=20261119k"></script>
<script src="../shared/js/categorias.js?v=20261119l"></script>
<script src="./scripts/modelo.js?v=20261119k"></script>
<script src="./scripts/core.js?v=20261119n"></script>
<script src="./scripts/store.js?v=20261119k"></script>
<script src="./scripts/acoes.js?v=20261119m"></script>
<script src="./scripts/extrato-parser.js?v=20261119k"></script>
<script src="./scripts/ui.js?v=20261119n"></script>
<script src="./scripts/telas.js?v=20261119n"></script>
<script src="./scripts/forms.js?v=20261119m"></script>
<script src="./scripts/ia-extrato.js?v=20261119k"></script>
<script src="./scripts/main.js?v=20261119k"></script>
<script src="../shared/js/sidebar.js?v=20261119k"></script>
</body>
</html>
