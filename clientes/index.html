<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Clientes · Meu Studio</title>
  <link rel="stylesheet" href="../shared/css/tokens.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="./styles/clientes.css">
</head>
<body>

<div class="hdr">
  <button class="hdr-back" onclick="window.location.href='../'" aria-label="Voltar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="hdr-center">
    <h1>Clientes</h1>
    <div class="hdr-sub" id="hsub">Carregando...</div>
  </div>
  <div class="hdr-right">
    <button class="hdr-icon-btn" onclick="openGuia()" title="Guia de Follow Up" aria-label="Guia de Follow Up">📖</button>
  </div>
</div>

<div class="msel">
  <button class="mnbtn" onclick="chm(-1)">‹</button>
  <div>
    <div class="mlab" id="mlab">—</div>
    <div class="msub" id="msub"></div>
  </div>
  <button class="mnbtn" onclick="chm(1)">›</button>
</div>

<div class="ftabs">
  <button class="ftab on" data-f="todos"     onclick="setF(this)">Todos</button>
  <button class="ftab"    data-f="Realizado"  onclick="setF(this)">✅ Realizado</button>
  <button class="ftab"    data-f="Previsto"   onclick="setF(this)">🔮 Previsto</button>
  <button class="ftab"    data-f="Noiva"      onclick="setF(this)">💍 Noivas</button>
</div>
<div class="ftabs" id="equipe-tabs" style="display:none;margin-top:4px"></div>

<div id="aviso" class="aviso">
  💡 Horários não encontrados no Google Agenda para este mês. Verifique se os eventos estão salvos pelo sistema de Confirmação de Agendamento.
</div>

<div class="chips" id="chips"></div>
<div class="content" id="content">
  <div class="loader"><div class="spinner"></div><br>Carregando dados...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="../shared/js/db.js"></script>
<script src="./scripts/clientes.js"></script>
<script src="../shared/js/global-search.js"></script>
<script src="../shared/js/global-notes.js"></script>
<script src="../shared/js/sidebar.js"></script>
<script src="../shared/js/alerts.js"></script>
</body>
</html>
